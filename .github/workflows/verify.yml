name: verify
on: push
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
  # Three jobs per viewport and one for the test build, side by side, each with its own server and test database.
  e2e:
    name: e2e (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Each viewport is split in three shards: one worker runs its ~280 tests in about 15 minutes, a shard in about 5.
        include:
          - {name: iPhone 1 of 3, args: --project=iPhone --shard=1/3}
          - {name: iPhone 2 of 3, args: --project=iPhone --shard=2/3}
          - {name: iPhone 3 of 3, args: --project=iPhone --shard=3/3}
          - {name: Android 1 of 3, args: --project=Android --shard=1/3}
          - {name: Android 2 of 3, args: --project=Android --shard=2/3}
          - {name: Android 3 of 3, args: --project=Android --shard=3/3}
          - {name: desktop 1 of 3, args: --project=desktop --shard=1/3}
          - {name: desktop 2 of 3, args: --project=desktop --shard=2/3}
          - {name: desktop 3 of 3, args: --project=desktop --shard=3/3}
          - {name: test-build, args: -c playwright.test-build.config.ts}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test ${{ matrix.args }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.name }}
          path: test-results
          retention-days: 7
