name: verify
on: push
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # One job per viewport and one for the test build, side by side, each with its own server and test database.
  e2e:
    name: e2e (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: iPhone-narrow, args: --project=iPhone e2e/ties.spec.ts e2e/race-rulings.spec.ts --repeat-each=4}
          - {name: Android-narrow, args: --project=Android e2e/ties.spec.ts e2e/race-rulings.spec.ts --repeat-each=4}
          - {name: iPhone-full, args: --project=iPhone}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test ${{ matrix.args }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.name }}
          path: test-results
          retention-days: 7
