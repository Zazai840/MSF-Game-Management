<!-- @dsCard group="Entry" height=360 subtitle="Finish-line tiles: runners, and relay teams over their 4th leg" -->
<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>RunnerButton - preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:ital,wdth,wght@1,62.5..100,600..900&amp;family=Nunito:wght@600;700;800&amp;display=swap">
</head>
<body class="rz-preview">
<div class="rz-stage"><div class="rz-phone" style="display:flex;flex-direction:column;gap:20px">
<ul class="rz-runners" aria-label="Runners not yet placed">
  <li><button type="button" class="rz-runner" aria-label="2032 came 3rd">2032</button></li>
  <li><button type="button" class="rz-runner" aria-label="2035 came 3rd">2035</button></li>
  <li><button type="button" class="rz-runner" aria-label="2036 came 3rd">2036</button></li>
</ul>
<ul class="rz-runners rz-runners--teams" aria-label="Teams not yet placed">
  <li><button type="button" class="rz-runner rz-runner--team" aria-label="Team 5, 4th leg 2054, came 1st"><span>Team 5</span><span>2054</span></button></li>
  <li><button type="button" class="rz-runner rz-runner--team" aria-label="Team 6, 4th leg 2064, came 1st"><span>Team 6</span><span>2064</span></button></li>
  <li><button type="button" class="rz-runner rz-runner--team" aria-label="Team 3, no 4th leg, came 1st"><span>Team 3</span><span>–</span></button></li>
</ul>
</div></div>
</body>
</html>
