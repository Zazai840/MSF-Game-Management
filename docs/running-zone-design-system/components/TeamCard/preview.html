<!-- @dsCard group="Entry" height=900 subtitle="A relay team at the start line: a heat card, then a final card" -->
<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>TeamCard - preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:ital,wdth,wght@1,62.5..100,600..900&amp;family=Nunito:wght@600;700;800&amp;display=swap">
</head>
<body class="rz-preview">
<div class="rz-stage"><div class="rz-phone" style="display:flex;flex-direction:column;gap:16px">
<section class="rz-teamcard" aria-label="Team 5">
  <div class="rz-teamcard__head"><h3 class="rz-teamcard__name">Team 5</h3><span class="rz-teamcard__note">Runs short · 3 of 4</span>
    <span class="rz-teamcard__marks"><button type="button" class="rz-btn rz-btn--small" aria-label="Edit Team 5">Edit</button></span></div>
  <ol class="rz-attendance rz-attendance--one rz-teamgrips" aria-label="Team 5 legs">
    <li><span class="rz-attendance__who"><span class="rz-attendance__seed">1st leg</span><span class="label">2071</span></span>
      <button type="button" class="rz-btn rz-btn--pill rz-btn--primary" aria-pressed="true" aria-label="2071: Here">Here</button>
      <button type="button" class="rz-orderrow__handle" aria-label="Move 2071" aria-roledescription="drag handle"><svg class="rz-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01" stroke-width="3.4"/></svg></button></li>
    <li data-dragging="true"><span class="rz-attendance__who"><span class="rz-attendance__seed">2nd leg</span><span class="label">2072</span></span>
      <button type="button" class="rz-btn rz-btn--pill rz-btn--primary" aria-pressed="true" aria-label="2072: Here">Here</button>
      <button type="button" class="rz-orderrow__handle" aria-label="Move 2072" aria-roledescription="drag handle"><svg class="rz-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01" stroke-width="3.4"/></svg></button></li>
    <li class="is-absent"><span class="rz-attendance__who"><span class="rz-attendance__seed">3rd leg</span><span class="label">2073</span></span>
      <button type="button" class="rz-btn rz-btn--pill" aria-pressed="false" aria-label="2073: Here">Not yet</button>
      <button type="button" class="rz-orderrow__handle" aria-label="Move 2073" aria-roledescription="drag handle"><svg class="rz-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01" stroke-width="3.4"/></svg></button></li>
    <li class="is-absent"><span class="rz-attendance__who"><span class="rz-attendance__seed">4th leg</span><span class="label">–</span></span>
      <button type="button" class="rz-orderrow__handle" aria-label="Move empty 4th leg" aria-roledescription="drag handle"><svg class="rz-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01" stroke-width="3.4"/></svg></button></li>
  </ol>
</section>
<section class="rz-teamcard rz-teamcard--final" aria-label="Team 2">
  <div class="rz-teamcard__head"><h3 class="rz-teamcard__name"><span class="rz-teamcard__seed">1st seed · </span>Team 2</h3>
    <button type="button" class="rz-btn rz-btn--small" aria-label="Edit Team 2">Edit</button>
    <span class="rz-teamcard__marks"><button type="button" class="rz-btn rz-btn--pill rz-btn--primary" aria-pressed="true" aria-label="Team 2: Here">Here</button><button type="button" class="rz-btn rz-btn--pill" aria-pressed="false" aria-label="Team 2: Absent">Absent</button></span></div>
  <ol class="rz-teamlegs rz-teamgrips" aria-label="Team 2 legs">
    <li><span class="rz-teamlegs__leg">1st leg</span><span class="label">2061</span><button type="button" class="rz-orderrow__handle" aria-label="Move 2061" aria-roledescription="drag handle"><svg class="rz-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01" stroke-width="3.4"/></svg></button></li>
    <li><span class="rz-teamlegs__leg">2nd leg</span><span class="label">2062</span><button type="button" class="rz-orderrow__handle" aria-label="Move 2062" aria-roledescription="drag handle"><svg class="rz-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01" stroke-width="3.4"/></svg></button></li>
    <li><span class="rz-teamlegs__leg">3rd leg</span><span class="label">2063</span><button type="button" class="rz-orderrow__handle" aria-label="Move 2063" aria-roledescription="drag handle"><svg class="rz-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01" stroke-width="3.4"/></svg></button></li>
    <li><span class="rz-teamlegs__leg">4th leg</span><span class="label">2064</span><button type="button" class="rz-orderrow__handle" aria-label="Move 2064" aria-roledescription="drag handle"><svg class="rz-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01" stroke-width="3.4"/></svg></button></li>
  </ol>
</section>
<section class="rz-teamcard rz-teamcard--final is-absent" aria-label="Team 4">
  <div class="rz-teamcard__head"><h3 class="rz-teamcard__name"><span class="rz-teamcard__seed">2nd seed · </span>Team 4</h3>
    <span class="rz-teamcard__marks"><button type="button" class="rz-btn rz-btn--pill" aria-pressed="false" aria-label="Team 4: Here">Here</button><button type="button" class="rz-btn rz-btn--pill rz-btn--primary" aria-pressed="true" aria-label="Team 4: Absent">Absent</button></span></div>
  <ul class="rz-teamlegs">
    <li><span class="rz-teamlegs__leg">1st leg</span><span class="label">2081</span></li>
    <li><span class="rz-teamlegs__leg">2nd leg</span><span class="label">2082</span></li>
    <li><span class="rz-teamlegs__leg">3rd leg</span><span class="label">2083</span></li>
    <li><span class="rz-teamlegs__leg">4th leg</span><span class="label">2084</span></li>
  </ul>
</section>
</div></div>
</body>
</html>
