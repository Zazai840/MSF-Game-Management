<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Motifs — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:ital,wdth,wght@1,62.5..100,600..900&amp;family=Nunito:wght@600;700;800&amp;display=swap">
</head>
<body class="rz-preview">
<div class="rz-row" style="align-items:stretch;gap:16px">
  <div class="rz-appbar" style="width:220px;height:150px;border-radius:var(--radius-xl)"><svg class="rz-pattern" aria-hidden="true"><defs><pattern id="rz-star-demo" width="44" height="44" patternUnits="userSpaceOnUse"><g><rect x="12" y="12" width="20" height="20"/><rect x="12" y="12" width="20" height="20" transform="rotate(45 22 22)"/><path d="M0 22H8M36 22H44M22 0V8M22 36V44"/></g></pattern></defs><rect width="100%" height="100%" fill="url(#rz-star-demo)"/></svg><div class="rz-stripes" aria-hidden="true"><span></span><span></span><span></span></div></div>
  <div style="display:flex;flex-direction:column;gap:12px;justify-content:center">
    <div class="rz-row">
      <span style="color:var(--running);width:58px;height:58px;display:block"><svg class="rz-star" viewBox="0 0 40 40" aria-hidden="true"><rect x="7" y="7" width="26" height="26" rx="3"/><rect x="7" y="7" width="26" height="26" rx="3" transform="rotate(45 20 20)"/></svg></span>
      <span style="color:var(--challenge);width:40px;height:40px;display:block"><svg class="rz-star" viewBox="0 0 40 40" aria-hidden="true"><rect x="7" y="7" width="26" height="26" rx="3"/><rect x="7" y="7" width="26" height="26" rx="3" transform="rotate(45 20 20)"/></svg></span>
      <span style="color:var(--gold);width:28px;height:28px;display:block"><svg class="rz-star" viewBox="0 0 40 40" aria-hidden="true"><rect x="7" y="7" width="26" height="26" rx="3"/><rect x="7" y="7" width="26" height="26" rx="3" transform="rotate(45 20 20)"/></svg></span>
      <span style="color:var(--jumping);width:18px;height:18px;display:block"><svg class="rz-star" viewBox="0 0 40 40" aria-hidden="true"><rect x="7" y="7" width="26" height="26" rx="3"/><rect x="7" y="7" width="26" height="26" rx="3" transform="rotate(45 20 20)"/></svg></span>
    </div>
    <div class="rz-row"><span class="rz-badge">Slant −12°</span><span class="rz-badge rz-badge--gold">Tag</span></div>
  </div>
</div>
</body>
</html>
