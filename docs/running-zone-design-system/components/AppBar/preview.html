<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>AppBar — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:ital,wdth,wght@1,62.5..100,600..900&amp;family=Nunito:wght@600;700;800&amp;display=swap">
</head>
<body class="rz-preview">
<div class="rz-stage rz-zone-running" style="padding:0;gap:16px;background:var(--paper)"><div class="rz-phone" style="display:flex;flex-direction:column;gap:16px"><header class="rz-appbar rz-appbar--hero">
  <svg class="rz-pattern" aria-hidden="true"><defs><pattern id="rz-star-hero" width="44" height="44" patternUnits="userSpaceOnUse"><g><rect x="12" y="12" width="20" height="20"/><rect x="12" y="12" width="20" height="20" transform="rotate(45 22 22)"/><path d="M0 22H8M36 22H44M22 0V8M22 36V44"/></g></pattern></defs><rect width="100%" height="100%" fill="url(#rz-star-hero)"/></svg>
  <div class="rz-stripes" aria-hidden="true"><span></span><span></span><span></span></div>
  <div class="rz-appbar__top">
    <p class="rz-appbar__eyebrow">MSF Olympics</p>
    <a class="rz-avatar" href="#me" aria-label="Amina Yusuf, your details">AY</a>
  </div>
  <h1 class="rz-appbar__title">Running <span>Zone</span></h1>
</header><header class="rz-appbar rz-appbar--compact">
  <svg class="rz-pattern" aria-hidden="true"><defs><pattern id="rz-star-compact" width="44" height="44" patternUnits="userSpaceOnUse"><g><rect x="12" y="12" width="20" height="20"/><rect x="12" y="12" width="20" height="20" transform="rotate(45 22 22)"/><path d="M0 22H8M36 22H44M22 0V8M22 36V44"/></g></pattern></defs><rect width="100%" height="100%" fill="url(#rz-star-compact)"/></svg>
  <div class="rz-stripes rz-stripes--small" aria-hidden="true"><span></span><span></span><span></span></div>
  <a class="rz-backlink" href="#finish"><svg class="rz-icon rz-icon--bold" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>Finishing order</a>
  <a class="rz-avatar" href="#me" aria-label="Amina Yusuf, your details">AY</a>
</header><header class="rz-appbar rz-appbar--compact rz-appbar--scoreboard">
  <svg class="rz-pattern" aria-hidden="true"><defs><pattern id="rz-star-board" width="44" height="44" patternUnits="userSpaceOnUse"><g><rect x="12" y="12" width="20" height="20"/><rect x="12" y="12" width="20" height="20" transform="rotate(45 22 22)"/><path d="M0 22H8M36 22H44M22 0V8M22 36V44"/></g></pattern></defs><rect width="100%" height="100%" fill="url(#rz-star-board)"/></svg>
  <a class="rz-backlink" href="#results"><svg class="rz-icon rz-icon--bold" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>Results</a>
  <a class="rz-avatar" href="#me" aria-label="Amina Yusuf, your details">AY</a>
</header></div></div>
</body>
</html>
