<!-- @dsCard group="Actions" height=407 subtitle="Home menu: one card per job" -->
<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>JobCard — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:ital,wdth,wght@1,62.5..100,600..900&amp;family=Nunito:wght@600;700;800&amp;display=swap">
</head>
<body class="rz-preview">
<div class="rz-stage rz-zone-running"><div class="rz-phone"><ul class="rz-jobs">
  <li>
    <a class="rz-job rz-job--checkin" href="#checkin">
      <span class="rz-job__icon"><svg class="rz-star" viewBox="0 0 40 40" aria-hidden="true"><rect x="7" y="7" width="26" height="26" rx="3"/><rect x="7" y="7" width="26" height="26" rx="3" transform="rotate(45 20 20)"/></svg><svg class="rz-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/></svg></span>
      <span class="rz-job__body">
        <span class="rz-job__title">Check in runners</span>
        <span class="rz-job__desc">Type each runner's wristband number before the race starts</span>
      </span>
      <svg class="rz-icon rz-icon--bold" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </a>
  </li>
  <li>
    <a class="rz-job rz-job--finish" href="#finish">
      <span class="rz-job__icon"><svg class="rz-star" viewBox="0 0 40 40" aria-hidden="true"><rect x="7" y="7" width="26" height="26" rx="3"/><rect x="7" y="7" width="26" height="26" rx="3" transform="rotate(45 20 20)"/></svg><svg class="rz-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6h10M10 12h10M10 18h10"/><path d="M4 6h1M4 12h1M4 18h1"/></svg></span>
      <span class="rz-job__body">
        <span class="rz-job__title">Record the finishing order</span>
        <span class="rz-job__desc">Tap runners in the order they crossed the line</span>
        <span class="rz-badge">1 race ready</span>
      </span>
      <svg class="rz-icon rz-icon--bold" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </a>
  </li>
  <li>
    <a class="rz-job rz-job--times" href="#times">
      <span class="rz-job__icon"><svg class="rz-star" viewBox="0 0 40 40" aria-hidden="true"><rect x="7" y="7" width="26" height="26" rx="3"/><rect x="7" y="7" width="26" height="26" rx="3" transform="rotate(45 20 20)"/></svg><svg class="rz-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M10 2h4"/></svg></span>
      <span class="rz-job__body">
        <span class="rz-job__title">Enter times</span>
        <span class="rz-job__desc">Type each place's time from the timer</span>
        <span class="rz-badge">2 races ready</span>
      </span>
      <svg class="rz-icon rz-icon--bold" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </a>
  </li>
</ul></div></div>
</body>
</html>
