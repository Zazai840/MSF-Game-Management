<!doctype html>
<html lang="en-GB">
<head>

<title>6 · Race as Finish line</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:ital,wdth,wght@1,62.5..100,600..900&amp;family=Nunito:wght@600;700;800&amp;display=swap">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../components/bundle.css">
<style>body{margin:0;background:#d9d2c3;display:flex;justify-content:center}</style>
</head>
<body>
<div class="rz-screen rz-zone-running" style="width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden">
  <header class="rz-appbar rz-appbar--compact" style="padding: 8px 14px 8px 6px">
    <svg class="rz-pattern" aria-hidden="true"><defs><pattern id="n6-star" width="44" height="44" patternUnits="userSpaceOnUse"><g><rect x="12" y="12" width="20" height="20"></rect><rect x="12" y="12" width="20" height="20" transform="rotate(45 22 22)"></rect><path d="M0 22H8M36 22H44M22 0V8M22 36V44"></path></g></pattern></defs><rect width="100%" height="100%" fill="url(#n6-star)"></rect></svg>
    <div style="display: flex; align-items: center; gap: 2px; min-width: 0">
      <a class="rz-backlink" href="N2-Races.html" aria-label="Back to races" style="padding: 0 6px"><svg class="rz-icon rz-icon--bold" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
      <h1 style="margin: 0; font-family: var(--font-display); font-style: italic; font-stretch: 75%; font-weight: 800; font-size: 22px; line-height: 1; text-transform: uppercase; white-space: nowrap">60m · Girl Cubs <span class="rz-code-tag" style="margin-left: 4px; font-size: 13px; vertical-align: 2px">R4</span></h1>
    </div>
    <a href="N4-Role.html" aria-label="Your job: Finish line. Change job" style="min-height: 44px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px 0 12px; border-radius: 999px; background: var(--paper); color: var(--navy); font-size: 14px; font-weight: 800; text-decoration: none; white-space: nowrap"><svg class="rz-icon" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px; stroke-width: 2.6"><path d="M10 6h10M10 12h10M10 18h10"></path><path d="M4 6h1M4 12h1M4 18h1"></path></svg>Finish line<svg class="rz-icon" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px; stroke-width: 2.8"><path d="M6 9l6 6 6-6"></path></svg></a>
  </header>

  <nav aria-label="Heats" style="padding: 12px 20px 0">
    <ol style="list-style: none; margin: 0; padding: 0; display: flex; gap: 8px">
      <li><a href="#h1" aria-label="Heat 1, done" style="min-width: 52px; height: 44px; padding: 0 8px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 2px; border-radius: 12px; background: var(--navy); color: var(--on-navy); text-decoration: none; font-family: var(--font-display); font-style: italic; font-stretch: 75%; font-weight: 800; font-size: 18px">H1<svg class="rz-icon" viewBox="0 0 24 24" aria-hidden="true" style="width: 14px; height: 14px; stroke-width: 3"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></a></li>
      <li><a href="#h2" aria-label="Heat 2, done" style="min-width: 52px; height: 44px; padding: 0 8px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 2px; border-radius: 12px; background: var(--navy); color: var(--on-navy); text-decoration: none; font-family: var(--font-display); font-style: italic; font-stretch: 75%; font-weight: 800; font-size: 18px">H2<svg class="rz-icon" viewBox="0 0 24 24" aria-hidden="true" style="width: 14px; height: 14px; stroke-width: 3"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></a></li>
      <li><a href="#h3" aria-label="Heat 3, done" style="min-width: 52px; height: 44px; padding: 0 8px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 2px; border-radius: 12px; background: var(--navy); color: var(--on-navy); text-decoration: none; font-family: var(--font-display); font-style: italic; font-stretch: 75%; font-weight: 800; font-size: 18px">H3<svg class="rz-icon" viewBox="0 0 24 24" aria-hidden="true" style="width: 14px; height: 14px; stroke-width: 3"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></a></li>
      <li><span aria-current="page" aria-label="Heat 4, this race" style="min-width: 52px; height: 44px; padding: 0 8px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: var(--gold); box-shadow: inset 0 0 0 2px var(--navy); color: var(--navy); font-family: var(--font-display); font-style: italic; font-stretch: 75%; font-weight: 800; font-size: 18px">H4</span></li>
      <li><a href="#h5" aria-label="Heat 5, checking in" style="min-width: 52px; height: 44px; padding: 0 8px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: var(--card); box-shadow: inset 0 0 0 2px var(--line); color: var(--navy); text-decoration: none; font-family: var(--font-display); font-style: italic; font-stretch: 75%; font-weight: 800; font-size: 18px">H5</a></li>
      <li><a href="N3-NewRace.html" aria-label="Add heat 6" style="width: 44px; height: 44px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 12px; border: 2px dashed var(--line-strong); color: var(--navy)"><svg class="rz-icon" viewBox="0 0 24 24" aria-hidden="true" style="width: 20px; height: 20px; stroke-width: 2.6"><path d="M12 5v14M5 12h14"></path></svg></a></li>
    </ol>
  </nav>

  <ul aria-label="Heat 4 progress" style="list-style: none; margin: 0; padding: 12px 20px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <li style="min-height: 48px; padding: 6px 10px; border-radius: 12px; display: flex; flex-direction: column; justify-content: center; gap: 1px; box-shadow: inset 0 0 0 1.5px var(--line)"><span style="display: flex; align-items: center; gap: 4px; font-size: 13px; line-height: 1.2; font-weight: 800">Runners<svg class="rz-icon" viewBox="0 0 24 24" aria-hidden="true" style="width: 14px; height: 14px; stroke-width: 3; color: var(--throwing-ink)"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span><span style="font-size: 12px; line-height: 1.3; font-weight: 600; color: var(--ink-muted)">8 checked in</span></li>
    <li style="min-height: 48px; padding: 6px 10px; border-radius: 12px; display: flex; flex-direction: column; justify-content: center; gap: 1px; background: var(--card); box-shadow: inset 0 0 0 2px var(--navy)"><span style="font-size: 13px; line-height: 1.2; font-weight: 800">Finishing order</span><span style="font-size: 12px; line-height: 1.3; font-weight: 700; color: var(--ink-muted)">You · 2 of 8</span></li>
    <li style="min-height: 48px; padding: 6px 10px; border-radius: 12px; display: flex; flex-direction: column; justify-content: center; gap: 1px; box-shadow: inset 0 0 0 1.5px var(--line)"><span style="font-size: 13px; line-height: 1.2; font-weight: 800">Times</span><span style="font-size: 12px; line-height: 1.3; font-weight: 600; color: var(--ink-muted)">1 of 8</span></li>
  </ul>

  <main style="flex: 1; padding: 16px 20px 0; display: flex; flex-direction: column; gap: 14px">
    <ol aria-label="Places: 2 of 8 recorded" style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
      <li><button type="button" aria-label="1st place: 2033. Change" style="width: 100%; height: 44px; padding: 0 4px; border: 0; border-radius: 10px; background: var(--navy); color: var(--on-navy); display: flex; align-items: center; justify-content: center; gap: 5px"><span style="font-family: var(--font-display); font-style: italic; font-stretch: 75%; font-weight: 800; font-size: 14px; text-transform: uppercase; color: var(--gold)">1st</span><span style="font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums">2033</span></button></li>
      <li><button type="button" aria-label="2nd place: 2031. Change" style="width: 100%; height: 44px; padding: 0 4px; border: 0; border-radius: 10px; background: var(--navy); color: var(--on-navy); display: flex; align-items: center; justify-content: center; gap: 5px"><span style="font-family: var(--font-display); font-style: italic; font-stretch: 75%; font-weight: 800; font-size: 14px; text-transform: uppercase; color: var(--gold)">2nd</span><span style="font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums">2031</span></button></li>
      <li><span aria-current="step" aria-label="3rd place: choosing now" style="height: 44px; box-sizing: border-box; border-radius: 10px; background: var(--gold); box-shadow: inset 0 0 0 2px var(--navy); color: var(--navy); display: flex; align-items: center; justify-content: center; gap: 5px; font-family: var(--font-display); font-style: italic; font-stretch: 75%; font-weight: 800; font-size: 14px; text-transform: uppercase">3rd<span style="font-size: 18px">?</span></span></li>
      <li><span aria-label="4th place: empty" style="height: 44px; box-sizing: border-box; border-radius: 10px; border: 1.5px dashed var(--line-strong); color: var(--ink-muted); display: flex; align-items: center; justify-content: center; gap: 5px; font-family: var(--font-display); font-style: italic; font-stretch: 75%; font-weight: 800; font-size: 14px; text-transform: uppercase">4th<span>–</span></span></li>
      <li><span aria-label="5th place: empty" style="height: 44px; box-sizing: border-box; border-radius: 10px; border: 1.5px dashed var(--line-strong); color: var(--ink-muted); display: flex; align-items: center; justify-content: center; gap: 5px; font-family: var(--font-display); font-style: italic; font-stretch: 75%; font-weight: 800; font-size: 14px; text-transform: uppercase">5th<span>–</span></span></li>
      <li><span aria-label="6th place: empty" style="height: 44px; box-sizing: border-box; border-radius: 10px; border: 1.5px dashed var(--line-strong); color: var(--ink-muted); display: flex; align-items: center; justify-content: center; gap: 5px; font-family: var(--font-display); font-style: italic; font-stretch: 75%; font-weight: 800; font-size: 14px; text-transform: uppercase">6th<span>–</span></span></li>
      <li><span aria-label="7th place: empty" style="height: 44px; box-sizing: border-box; border-radius: 10px; border: 1.5px dashed var(--line-strong); color: var(--ink-muted); display: flex; align-items: center; justify-content: center; gap: 5px; font-family: var(--font-display); font-style: italic; font-stretch: 75%; font-weight: 800; font-size: 14px; text-transform: uppercase">7th<span>–</span></span></li>
      <li><span aria-label="8th place: empty" style="height: 44px; box-sizing: border-box; border-radius: 10px; border: 1.5px dashed var(--line-strong); color: var(--ink-muted); display: flex; align-items: center; justify-content: center; gap: 5px; font-family: var(--font-display); font-style: italic; font-stretch: 75%; font-weight: 800; font-size: 14px; text-transform: uppercase">8th<span>–</span></span></li>
    </ol>

    <div class="rz-prompt rz-prompt--compact">
      <p class="rz-prompt__meta">Heat 4 · 8 runners · 6 to place</p>
      <h2 class="rz-prompt__q">Who came <em>3rd?</em></h2>
    </div>

    <ul aria-label="Runners not yet placed" style="list-style: none; margin: 0; padding: 0 0 4px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 10px">
      <li><button type="button" aria-label="2032 came 3rd" style="width: 100%; height: 72px; border: 0; border-radius: 36px 36px 12px 12px; background: var(--card); box-shadow: var(--shadow-tile); color: var(--navy); font-family: var(--font-display); font-style: italic; font-stretch: 75%; font-weight: 900; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums">2032</button></li>
      <li><button type="button" aria-label="2034 came 3rd" style="width: 100%; height: 72px; border: 0; border-radius: 36px 36px 12px 12px; background: var(--card); box-shadow: var(--shadow-tile); color: var(--navy); font-family: var(--font-display); font-style: italic; font-stretch: 75%; font-weight: 900; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums">2034</button></li>
      <li><button type="button" aria-label="2035 came 3rd" style="width: 100%; height: 72px; border: 0; border-radius: 36px 36px 12px 12px; background: var(--card); box-shadow: var(--shadow-tile); color: var(--navy); font-family: var(--font-display); font-style: italic; font-stretch: 75%; font-weight: 900; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums">2035</button></li>
      <li><button type="button" aria-label="2036 came 3rd" style="width: 100%; height: 72px; border: 0; border-radius: 36px 36px 12px 12px; background: var(--card); box-shadow: var(--shadow-tile); color: var(--navy); font-family: var(--font-display); font-style: italic; font-stretch: 75%; font-weight: 900; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums">2036</button></li>
      <li><button type="button" aria-label="2037 came 3rd" style="width: 100%; height: 72px; border: 0; border-radius: 36px 36px 12px 12px; background: var(--card); box-shadow: var(--shadow-tile); color: var(--navy); font-family: var(--font-display); font-style: italic; font-stretch: 75%; font-weight: 900; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums">2037</button></li>
      <li><button type="button" aria-label="2038 came 3rd" style="width: 100%; height: 72px; border: 0; border-radius: 36px 36px 12px 12px; background: var(--card); box-shadow: var(--shadow-tile); color: var(--navy); font-family: var(--font-display); font-style: italic; font-stretch: 75%; font-weight: 900; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums">2038</button></li>
    </ul>
  </main>

  <footer class="rz-footer">
    <a class="rz-btn rz-btn--display rz-btn--block" href="N6b-CheckOrder.html">Nobody else crossed the line</a>
    <button class="rz-btn rz-btn--block" type="button">+ Runner not on the list</button>
  </footer>
</div>
</body>
</html>
