<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4 · Switch job</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:ital,wdth,wght@1,62.5..100,600..900&amp;family=Nunito:wght@600;700;800&amp;display=swap">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../components/bundle.css">
<style>body{margin:0;background:#d9d2c3;display:flex;justify-content:center}</style>
</head>
<body>
<div class="rz-screen rz-zone-running" style="position: relative; width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden">
  <header class="rz-appbar rz-appbar--compact" style="padding-left: 6px">
    <svg class="rz-pattern" aria-hidden="true"><defs><pattern id="n4-star" width="44" height="44" patternUnits="userSpaceOnUse"><g><rect x="12" y="12" width="20" height="20"></rect><rect x="12" y="12" width="20" height="20" transform="rotate(45 22 22)"></rect><path d="M0 22H8M36 22H44M22 0V8M22 36V44"></path></g></pattern></defs><rect width="100%" height="100%" fill="url(#n4-star)"></rect></svg>
    <span style="font-family: var(--font-display); font-style: italic; font-stretch: 75%; font-weight: 800; font-size: 22px; line-height: 1; text-transform: uppercase; padding-left: 44px">60m · Girl Cubs</span>
  </header>
  <div style="margin: 12px 20px 0; height: 44px; border-radius: 12px; background: var(--card); box-shadow: var(--shadow-card)"></div>
  <div style="margin: 12px 20px 0; height: 120px; border-radius: 18px; background: var(--card); box-shadow: var(--shadow-card)"></div>

  <div class="rz-scrim rz-scrim--contained">
    <div class="rz-sheet" role="dialog" aria-modal="true" aria-labelledby="role-title">
      <div class="rz-sheet__grip" aria-hidden="true"></div>
      <h2 class="rz-sheet__title" id="role-title">Your job</h2>
      <p class="rz-sheet__text">This changes what you see on every race. Switch back any time.</p>
      <div role="radiogroup" aria-labelledby="role-title" style="display: flex; flex-direction: column; gap: 8px">
        <a href="N5-StartLine.html" role="radio" aria-checked="false" style="display: grid; grid-template-columns: 40px 1fr 24px; align-items: center; gap: 12px; min-height: 64px; padding: 8px 14px 8px 10px; border-radius: 14px; background: var(--card); box-shadow: var(--shadow-card); color: var(--navy); text-decoration: none">
          <span style="position: relative; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center"><svg class="rz-star" viewBox="0 0 40 40" aria-hidden="true" style="position: absolute; inset: 0; fill: var(--running)"><rect x="7" y="7" width="26" height="26" rx="3"></rect><rect x="7" y="7" width="26" height="26" rx="3" transform="rotate(45 20 20)"></rect></svg><svg class="rz-icon" viewBox="0 0 24 24" aria-hidden="true" style="position: relative; width: 18px; height: 18px; stroke-width: 2.6"><path d="M5 21V4"></path><path d="M5 4h11l-2 4 2 4H5"></path></svg></span>
          <span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 16px; font-weight: 800">Start line</span><span style="font-size: 13px; color: var(--ink-muted)">Type wristband numbers before the start</span></span>
          <span></span>
        </a>
        <a href="N6-FinishLine.html" role="radio" aria-checked="false" style="display: grid; grid-template-columns: 40px 1fr 24px; align-items: center; gap: 12px; min-height: 64px; padding: 8px 14px 8px 10px; border-radius: 14px; background: var(--card); box-shadow: var(--shadow-card); color: var(--navy); text-decoration: none">
          <span style="position: relative; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center"><svg class="rz-star" viewBox="0 0 40 40" aria-hidden="true" style="position: absolute; inset: 0; fill: var(--challenge)"><rect x="7" y="7" width="26" height="26" rx="3"></rect><rect x="7" y="7" width="26" height="26" rx="3" transform="rotate(45 20 20)"></rect></svg><svg class="rz-icon" viewBox="0 0 24 24" aria-hidden="true" style="position: relative; width: 18px; height: 18px; stroke-width: 2.6"><path d="M10 6h10M10 12h10M10 18h10"></path><path d="M4 6h1M4 12h1M4 18h1"></path></svg></span>
          <span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 16px; font-weight: 800">Finish line</span><span style="font-size: 13px; color: var(--ink-muted)">Tap runners as they cross the line</span></span>
          <span></span>
        </a>
        <a href="N7-Timer.html" role="radio" aria-checked="true" style="display: grid; grid-template-columns: 40px 1fr 24px; align-items: center; gap: 12px; min-height: 64px; padding: 8px 14px 8px 10px; border-radius: 14px; background: var(--card); box-shadow: inset 0 0 0 2px var(--navy); color: var(--navy); text-decoration: none">
          <span style="position: relative; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center"><svg class="rz-star" viewBox="0 0 40 40" aria-hidden="true" style="position: absolute; inset: 0; fill: var(--gold)"><rect x="7" y="7" width="26" height="26" rx="3"></rect><rect x="7" y="7" width="26" height="26" rx="3" transform="rotate(45 20 20)"></rect></svg><svg class="rz-icon" viewBox="0 0 24 24" aria-hidden="true" style="position: relative; width: 18px; height: 18px; stroke-width: 2.6"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2 2"></path><path d="M10 2h4"></path></svg></span>
          <span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 16px; font-weight: 800">Timer</span><span style="font-size: 13px; color: var(--ink-muted)">Type times from the stopwatch</span></span>
          <svg class="rz-icon" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 3"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
        </a>
      </div>
      <a href="N8-Lead.html" style="display: grid; grid-template-columns: 40px 1fr 24px; align-items: center; gap: 12px; min-height: 64px; padding: 8px 14px 8px 10px; border-radius: 14px; background: transparent; box-shadow: inset 0 0 0 1.5px var(--line-strong); color: var(--navy); text-decoration: none">
        <span style="position: relative; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center"><svg class="rz-star" viewBox="0 0 40 40" aria-hidden="true" style="position: absolute; inset: 0; fill: var(--jumping)"><rect x="7" y="7" width="26" height="26" rx="3"></rect><rect x="7" y="7" width="26" height="26" rx="3" transform="rotate(45 20 20)"></rect></svg><svg class="rz-icon" viewBox="0 0 24 24" aria-hidden="true" style="position: relative; width: 18px; height: 18px; stroke-width: 2.4"><rect x="4" y="4" width="7" height="7" rx="1.5"></rect><rect x="13" y="4" width="7" height="7" rx="1.5"></rect><rect x="4" y="13" width="7" height="7" rx="1.5"></rect><rect x="13" y="13" width="7" height="7" rx="1.5"></rect></svg></span>
        <span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 16px; font-weight: 800">Zone lead</span><span style="font-size: 13px; color: var(--ink-muted)">See and fix every step. Needs the lead code.</span></span>
        <svg class="rz-icon rz-icon--bold" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </a>
      <a class="rz-btn rz-btn--small rz-btn--block" href="N7-Timer.html">Close</a>
    </div>
  </div>
</div>
</body>
</html>
