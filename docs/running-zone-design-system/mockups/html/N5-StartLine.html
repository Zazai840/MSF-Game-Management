<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5 · Race as Start line</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:ital,wdth,wght@1,62.5..100,600..900&amp;family=Nunito:wght@600;700;800&amp;display=swap">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../components/bundle.css">
<style>body{margin:0;background:#d9d2c3;display:flex;justify-content:center}</style>
</head>
<body>
<div class="rz-screen rz-zone-running" style="width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden">
  <header class="rz-appbar rz-appbar--compact" style="padding: 8px 14px 8px 6px">
    <svg class="rz-pattern" aria-hidden="true"><defs><pattern id="n5-star" width="44" height="44" patternUnits="userSpaceOnUse"><g><rect x="12" y="12" width="20" height="20"></rect><rect x="12" y="12" width="20" height="20" transform="rotate(45 22 22)"></rect><path d="M0 22H8M36 22H44M22 0V8M22 36V44"></path></g></pattern></defs><rect width="100%" height="100%" fill="url(#n5-star)"></rect></svg>
    <div style="display: flex; align-items: center; gap: 2px; min-width: 0">
      <a class="rz-backlink" href="N2-Races.html" aria-label="Back to races" style="padding: 0 6px"><svg class="rz-icon rz-icon--bold" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
      <h1 style="margin: 0; font-family: var(--font-display); font-style: italic; font-stretch: 75%; font-weight: 800; font-size: 22px; line-height: 1; text-transform: uppercase; white-space: nowrap">60m · Girl Cubs <span class="rz-code-tag" style="margin-left: 4px; font-size: 13px; vertical-align: 2px">R4</span></h1>
    </div>
    <a href="N4-Role.html" aria-label="Your job: Start line. Change job" style="min-height: 44px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px 0 12px; border-radius: 999px; background: var(--paper); color: var(--navy); font-size: 14px; font-weight: 800; text-decoration: none; white-space: nowrap"><svg class="rz-icon" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px; stroke-width: 2.6"><path d="M5 21V4"></path><path d="M5 4h11l-2 4 2 4H5"></path></svg>Start line<svg class="rz-icon" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px; stroke-width: 2.8"><path d="M6 9l6 6 6-6"></path></svg></a>
  </header>

  <nav aria-label="Heats" style="padding: 12px 20px 0">
    <ol style="list-style: none; margin: 0; padding: 0; display: flex; gap: 8px">
      <li><a href="#h1" aria-label="Heat 1, runners done" style="min-width: 52px; height: 44px; padding: 0 8px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 2px; border-radius: 12px; background: var(--navy); color: var(--on-navy); text-decoration: none; font-family: var(--font-display); font-style: italic; font-stretch: 75%; font-weight: 800; font-size: 18px">H1<svg class="rz-icon" viewBox="0 0 24 24" aria-hidden="true" style="width: 14px; height: 14px; stroke-width: 3"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></a></li>
      <li><a href="#h2" aria-label="Heat 2, runners done" style="min-width: 52px; height: 44px; padding: 0 8px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 2px; border-radius: 12px; background: var(--navy); color: var(--on-navy); text-decoration: none; font-family: var(--font-display); font-style: italic; font-stretch: 75%; font-weight: 800; font-size: 18px">H2<svg class="rz-icon" viewBox="0 0 24 24" aria-hidden="true" style="width: 14px; height: 14px; stroke-width: 3"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></a></li>
      <li><a href="#h3" aria-label="Heat 3, runners done" style="min-width: 52px; height: 44px; padding: 0 8px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 2px; border-radius: 12px; background: var(--navy); color: var(--on-navy); text-decoration: none; font-family: var(--font-display); font-style: italic; font-stretch: 75%; font-weight: 800; font-size: 18px">H3<svg class="rz-icon" viewBox="0 0 24 24" aria-hidden="true" style="width: 14px; height: 14px; stroke-width: 3"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></a></li>
      <li><a href="#h4" aria-label="Heat 4, runners done" style="min-width: 52px; height: 44px; padding: 0 8px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 2px; border-radius: 12px; background: var(--navy); color: var(--on-navy); text-decoration: none; font-family: var(--font-display); font-style: italic; font-stretch: 75%; font-weight: 800; font-size: 18px">H4<svg class="rz-icon" viewBox="0 0 24 24" aria-hidden="true" style="width: 14px; height: 14px; stroke-width: 3"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></a></li>
      <li><span aria-current="page" aria-label="Heat 5, this race" style="min-width: 52px; height: 44px; padding: 0 8px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: var(--gold); box-shadow: inset 0 0 0 2px var(--navy); color: var(--navy); font-family: var(--font-display); font-style: italic; font-stretch: 75%; font-weight: 800; font-size: 18px">H5</span></li>
      <li><a href="N3-NewRace.html" aria-label="Add heat 6" style="width: 44px; height: 44px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 12px; border: 2px dashed var(--line-strong); color: var(--navy)"><svg class="rz-icon" viewBox="0 0 24 24" aria-hidden="true" style="width: 20px; height: 20px; stroke-width: 2.6"><path d="M12 5v14M5 12h14"></path></svg></a></li>
    </ol>
  </nav>

  <ul aria-label="Heat 5 progress" style="list-style: none; margin: 0; padding: 12px 20px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <li style="min-height: 48px; padding: 6px 10px; border-radius: 12px; display: flex; flex-direction: column; justify-content: center; gap: 1px; background: var(--card); box-shadow: inset 0 0 0 2px var(--navy)"><span style="font-size: 13px; line-height: 1.2; font-weight: 800">Runners</span><span style="font-size: 12px; line-height: 1.3; font-weight: 700; color: var(--ink-muted)">You · 3 so far</span></li>
    <li style="min-height: 48px; padding: 6px 10px; border-radius: 12px; display: flex; flex-direction: column; justify-content: center; gap: 1px; box-shadow: inset 0 0 0 1.5px var(--line)"><span style="font-size: 13px; line-height: 1.2; font-weight: 800">Finishing order</span><span style="font-size: 12px; line-height: 1.3; font-weight: 600; color: var(--ink-muted)">Not started</span></li>
    <li style="min-height: 48px; padding: 6px 10px; border-radius: 12px; display: flex; flex-direction: column; justify-content: center; gap: 1px; box-shadow: inset 0 0 0 1.5px var(--line)"><span style="font-size: 13px; line-height: 1.2; font-weight: 800">Times</span><span style="font-size: 12px; line-height: 1.3; font-weight: 600; color: var(--ink-muted)">Not started</span></li>
  </ul>

  <main style="flex: 1; padding: 18px 20px 0; display: flex; flex-direction: column; gap: 14px">
    <div class="rz-prompt rz-prompt--compact">
      <p class="rz-prompt__meta">Heat 5 · 3 runners so far</p>
      <h2 class="rz-prompt__q">Runner 4: wristband number?</h2>
    </div>
    <ul class="rz-chips" aria-label="Wristbands entered">
      <li><button class="rz-chip" type="button" aria-label="Remove 2041">2041 <svg class="rz-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"></path></svg></button></li>
      <li><button class="rz-chip" type="button" aria-label="Remove 2042">2042 <svg class="rz-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"></path></svg></button></li>
      <li><button class="rz-chip" type="button" aria-label="Remove 2043">2043 <svg class="rz-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"></path></svg></button></li>
    </ul>
    <div class="rz-field">
      <label class="rz-field__label" for="wb">Wristband number</label>
      <input class="rz-field__input" id="wb" inputmode="numeric" pattern="[0-9]*" autocomplete="off" value="2044">
      <p class="rz-field__hint">Tap a number above to remove it.</p>
    </div>
  </main>

  <footer class="rz-footer">
    <div class="rz-footer__pair">
      <a class="rz-btn" href="N2-Races.html">That's everyone</a>
      <button class="rz-btn rz-btn--primary" type="button">Next</button>
    </div>
  </footer>
</div>
</body>
</html>
