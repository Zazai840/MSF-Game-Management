services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: running
      POSTGRES_DB: running
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - running-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U running -d running"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5433}:5432"
  app:
    build: .
    depends_on:
      database:
        condition: service_healthy
    environment:
      OWNER_PASSWORD: ${OWNER_PASSWORD:?Set OWNER_PASSWORD in .env}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
volumes:
  running-data:
