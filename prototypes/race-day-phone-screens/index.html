function B_App(p) {
  const { st, nav, go, me, openLead, openBecome } = p;
  const job = nav.job || "finish";
  const c = me.level !== "volunteer" ? needsYou(st).length : 0;
  const tabs = [["start", "Start", "⚑", startLineRaces(st).filter(r => r.atStart).length], ["finish", "Finish", "⇣", waitingFor(st, "finish").length], ["times", "Times", "⏱", waitingFor(st, "times").length]];
  return html`<div className="scr">
    ${job === "more" ? html`<${B_More} ...${p} />` : job === "start" ? html`<${B_Start} ...${p} />` : job === "finish" ? html`<${B_Finish} ...${p} />` : html`<${B_Times} ...${p} />`}
    <nav className="tabs">
      ${tabs.map(([k, l, ico, n]) => html`<button key=${k} aria-current=${job === k} onClick=${() => go({ job: k, race: null })}><span className="ico" aria-hidden="true">${ico}</span>${l}${n ? html`<span className="badge" style=${{ background: "var(--accent)" }}>${n}</span>` : null}</button>`)}
      ${me.level !== "volunteer" ? html`<button onClick=${openLead}><span className="ico" aria-hidden="true">★</span>Lead${c ? html`<span className="badge">${c}</span>` : null}</button>`
        : html`<button aria-current=${job === "more"} onClick=${() => go({ job: "more" })}><span className="ico" aria-hidden="true">☰</span>More</button>`}
    </nav>
  </div>`;
}
function B_More(p) {
  const { me, openBecome } = p;
  return html`<div className="scroll"><h2 style=${{ margin: 0 }}>You</h2><div className="card">Joined as <b>${me.name}</b> · Volunteer</div><button className="btn block" onClick=${openBecome}>Become lead</button></div>`;
}
function B_Strip({ st, races, current, onPick, label }) {
  return html`<div className="strip" aria-label=${label}>${races.map(r => html`<button key=${r.id} aria-pressed=${current && r.id === current.id} onClick=${() => onPick(r.id)}>
    <b>${r.event} · ${raceLabel(r)}</b><small>${r.atStart ? "checking in · " : ""}${evOf(st, r).name} ${evOf(st, r).section.replace("Boy ", "B ").replace("Girl ", "G ")} · ${hhmm(r.checkedInAt)}${mismatch(r) ? " · ⚠" : ""}</small></button>`)}
  </div>`;
}
function B_Head({ title, sub, right }) {
  return html`<div className="topbar"><div className="title">${title}${sub ? html`<div className="who">${sub}</div>` : null}</div>${right}</div>`;
}
function B_Start(p) {
  const { st, nav, go, mutate, save, toast } = p;
  const at = startLineRaces(st);
  const r = nav.race ? st.races.find(x => x.id === nav.race) : null;
  const sl = useStartLine(st, r);
  const [pick, setPick] = useState(false);
  const newBtn = html`<button className="leadbtn" onClick=${() => setPick(true)}>+ New race</button>`;
  return html`<div className="scr">
    <${B_Head} title="Start line" sub=${at.filter(r => r.atStart).length + " being checked in"} right=${newBtn} />
    ${at.length ? html`<${B_Strip} st=${st} races=${at} current=${r} onPick=${id => go({ race: id })} label="Races at the start line" />` : null}
    ${!r ? html`<div className="scroll"><div className="card">Pick a race above, or tap <b>+ New race</b> and choose the event.</div></div>`
    : isLocked(st, r) ? html`<div className="scroll"><${RaceHead} st=${st} r=${r} /><${Locked} /></div>`
    : html`<div className="scroll">
      <${RaceHead} st=${st} r=${{ ...r, runners: sl.list.filter(x => !x.absent) }} />
      <div className="list">${sl.list.map((x, i) => html`<div key=${x.num} className=${"prow" + (x.warning ? " warn" : "")} style=${x.warning ? { background: "var(--warn-bg)", borderColor: "var(--warn-line)" } : null}>
        <span className="pl">${i + 1}</span><span className="n" style=${x.absent ? { textDecoration: "line-through", color: "var(--muted)" } : null}>${x.num}</span>
        ${x.warning ? html`<span className="pill warn">${WARN_TEXT[x.warning]}</span>` : null}
        ${r.kind === "final" ? html`<button className="ic" onClick=${() => sl.toggleAbsent(x.num)}>${x.absent ? "↺" : "Absent"}</button>` : html`<button className="ic" aria-label=${"Remove " + x.num} onClick=${() => sl.remove(x.num)}>✕</button>`}</div>`)}
        ${r.kind !== "final" && sl.list.length < 6 ? html`<div className="prow empty"><span className="pl">${sl.list.length + 1}</span><span className="n">${6 - sl.list.length} place${6 - sl.list.length === 1 ? "" : "s"} left</span></div>` : null}
      </div>
      ${sl.refuse ? html`<div className="alert bad">${sl.refuse}</div>` : null}
      <div className="row"><button className="btn danger" onClick=${() => { mutate(s => { s.races.find(x => x.id === r.id).deleted = "soft"; }); go({ race: null }); toast("Moved to Deleted races"); }}>Delete</button>
      <button className="btn primary" disabled=${!sl.list.length} onClick=${() => save(() => { mutate(s => saveRunners(s, r, sl)); }, "Saved - race is ready at the finish")}>Save runners</button></div>
    </div>
    ${r.kind !== "final" ? html`<div className="dock">
      <div className=${"display" + (sl.d ? "" : " empty")} style=${{ minHeight: 58, fontSize: 40 }}>${sl.d || "Type a wristband number"}</div>
      <${Keypad} onDigit=${k => { sl.setRefuse(""); sl.setD(x => (x + k).slice(0, 4)); }} onBack=${() => sl.setD(x => x.slice(0, -1))} go=${() => sl.add()} goDisabled=${!sl.d || sl.list.length >= 6} />
    </div>` : null}`}
    ${sl.w ? html`<${WarnSheet} w=${sl.w} onFix=${sl.fix} onKeep=${sl.keep} />` : null}
    ${pick ? html`<${Sheet} onClose=${() => setPick(false)}><h3>New race: which event?</h3>
      ${eventsByName(st).map(g => html`<div key=${g.name}><div className="label" style=${{ margin: "4px 0" }}>${g.name}</div><div className="segs">${g.evs.filter(e => e.stage === "open").map(e => html`<button key=${e.code} onClick=${() => { let id; mutate(s => { id = newRace(s, e.code); }); setPick(false); setTimeout(() => go({ race: id }), 0); }}>${e.section} <span className="who">${e.code}</span></button>`)}</div></div>`)}
    <//>` : null}
  </div>`;
}
function B_Finish(p) {
  const { st, nav, go, mutate, save, refresh } = p;
  const w = waitingFor(st, "finish");
  const r = nav.race ? st.races.find(x => x.id === nav.race) : w[0];
  const fo = useFinishOrder(r);
  const [sheet, setSheet] = useState(null);
  const recent = recentFor(st, "finish");
  const stripRaces = [...w, ...recent.filter(x => !w.includes(x))];
  const doSave = how => { setSheet(null); save(() => { mutate(s => saveFinish(s, r, fo, how)); go({ race: null }); }, "Saved finish order"); };
  // one list: placed rows first (in order, with arrows), then unplaced rows
  return html`<div className="scr">
    <${B_Head} title="Finish order" sub=${w.length + " waiting"} right=${html`<button className="leadbtn" onClick=${refresh} aria-label="Refresh">↻</button>`} />
    <${B_Strip} st=${st} races=${stripRaces} current=${r} onPick=${id => go({ race: id })} label="Races waiting, then recent" />
    ${!r ? html`<div className="scroll"><div className="alert ok">No races waiting for a finish order.</div></div>` : html`
    <div className="scroll">
      <${RaceHead} st=${st} r=${r} />
      ${isLocked(st, r) ? html`<${Locked} />` : html`
      <p className="who" style=${{ margin: 0 }}>Tap each number in the order they finished. Tap again to undo.</p>
      ${fo.placed.map((n, i) => html`<div key=${"p" + n} className="row">
        <button className="brow on" onClick=${() => fo.tap(n)}><span className="badge-pl">${ord(i + 1)}</span><span className="n">${n}</span></button>
        <div style=${{ display: "flex", flexDirection: "column", gap: 4 }}><button className="ic prow" style=${{ padding: 0, justifyContent: "center", width: 44, height: 31 }} aria-label="Move up" onClick=${() => fo.move(i, -1)}>▲</button><button className="ic prow" style=${{ padding: 0, justifyContent: "center", width: 44, height: 31 }} aria-label="Move down" onClick=${() => fo.move(i, 1)}>▼</button></div></div>`)}
      ${fo.unplaced.map(n => html`<button key=${"u" + n} className="brow" onClick=${() => fo.tap(n)}><span className="badge-pl">-</span><span className="n">${n}</span><span className="who">tap for ${ord(fo.placed.length + 1)}</span></button>`)}
      <button className="btn ghost block" onClick=${() => setSheet("add")}>+ Runner not on the list</button>`}
    </div>
    ${!isLocked(st, r) ? html`<div className="dock"><button className="btn primary block" disabled=${!fo.placed.length && !fo.unplaced.length} onClick=${() => fo.unplaced.length ? setSheet("unplaced") : doSave({})}>Save · ${fo.placed.length} placed${fo.unplaced.length ? ", " + fo.unplaced.length + " not placed" : ""}</button></div>` : null}`}
    ${sheet === "add" ? html`<${AddRunnerSheet} st=${st} r=${r} list=${fo.all.map(n => ({ num: n }))} onClose=${() => setSheet(null)} onAdd=${x => { fo.setExtra(e => [...e, x]); setSheet(null); }} />` : null}
    ${sheet === "unplaced" ? html`<${UnplacedSheet} unplaced=${fo.unplaced} onClose=${() => setSheet(null)} onDone=${doSave} />` : null}
  </div>`;
}
function B_Times(p) {
  const { st, nav, go, mutate, save, refresh } = p;
  const w = waitingFor(st, "times");
  const r = nav.race ? st.races.find(x => x.id === nav.race) : w[0];
  const tm = useTimes(r);
  const [cur, setCurRaw] = useState(0);
  const [fresh, setFresh] = useState(true);
  const setCur = i => { setCurRaw(i); setFresh(true); };
  useEffect(() => { setCur(0); }, [r && r.id]);
  const recent = recentFor(st, "times");
  const stripRaces = [...w, ...recent.filter(x => !w.includes(x))];
  const box = tm.boxes[cur];
  const type = k => { if (!box || box.nf) return; tm.setKept(false); tm.setDigits(cur, fresh ? k : box.d + k); setFresh(false); };
  const next = () => { const i = tm.boxes.findIndex((b, j) => j > cur && !b.nf); setCur(i >= 0 ? i : cur); };
  return html`<div className="scr">
    <${B_Head} title="Times" sub=${w.length + " waiting"} right=${html`<button className="leadbtn" onClick=${refresh} aria-label="Refresh">↻</button>`} />
    <${B_Strip} st=${st} races=${stripRaces} current=${r} onPick=${id => go({ race: id })} label="Races waiting, then recent" />
    ${!r ? html`<div className="scroll"><div className="alert ok">No races waiting for times.</div></div>` : isLocked(st, r) ? html`<div className="scroll"><${RaceHead} st=${st} r=${r} /><${Locked} /></div>` : html`
    <div className="scroll">
      ${mismatch(r) ? html`<div className="alert bad">Finish order has ${r.order.length} finishers, times have ${nonNull(r.times)} - check the recording</div>` : null}
      <div className="who"><b style=${{ color: "var(--ink)" }}>${raceName(st, r)} (${r.event}) · ${raceLabel(r)}</b> · ${r.runners.length} runners · checked in ${hhmm(r.checkedInAt)}</div>
      <div className="tlist">${tm.boxes.map((b, i) => html`<button key=${i} className=${"trow" + (b.nf ? " nf" : "") + (i === cur && !b.nf ? " cur" : "") + (tm.ooo === i && !tm.kept ? " warn" : "")} style=${{ textAlign: "left" }} onClick=${() => !b.nf && setCur(i)}>
        <span className="pl">${ord(i + 1)}</span>
        ${b.nf ? html`<span className="nfl">No finisher</span>` : html`<span className="tval">${fmtDigits(b.d) || html`<span className="who" style=${{ fontFamily: "var(--font-body)", fontSize: 15 }}>${i === cur ? "e.g. 1234 → 12.34" : ""}</span>`}</span>`}<span></span></button>`)}</div>
      <${MismatchNote} st=${st} r=${r} tm=${tm} />
    </div>
    <div className="dock">
      ${tm.ooo >= 0 && !tm.kept ? html`<${OooWarn} tm=${tm} i=${tm.ooo} />` : null}
      <${Keypad} onDigit=${type} onBack=${() => { if (box && !box.nf) { tm.setDigits(cur, box.d.slice(0, -1)); setFresh(false); } }} go=${next} goLabel="Next ↓" />
      <div className="row">
        <button className="btn" onClick=${tm.markNF} style=${{ fontSize: 15 }}>No finisher</button>
        <button className="btn" onClick=${tm.unmarkNF} style=${{ fontSize: 15, flex: .6 }} disabled=${!tm.boxes.some(b => b.nf)}>Undo</button>
        <button className="btn primary" disabled=${!tm.filled || (tm.ooo >= 0 && !tm.kept)} onClick=${() => save(() => { mutate(s => saveTimes(s, r, tm)); go({ race: null }); }, "Saved times")}>Save</button>
      </div>
    </div>`}
  </div>`;
}

/* ======================================================================
   VARIANT C - One question at a time (wizard)
   ====================================================================== */
function C_App(p) {
  const { st, nav, go, me, openBecome } = p;
  const job = nav.job;
  if (!job) return html`<div className="scr">
    <div className="topbar"><div className="title">Hi ${me.name}</div><${LeadBtn} ...${p} /></div>
    <div className="scroll">
      <h2 className="q">What are you doing?</h2>
      <div className="homeC">
        <button className="job" onClick=${() => go({ job: "start" })}><b>Start line</b><span>Writing down who is running</span></button>
        <button className="job" onClick=${() => go({ job: "finish" })}><b>Finish order</b><span>Writing down who came 1st, 2nd, 3rd · ${waitingFor(st, "finish").length} waiting</span></button>
        <button className="job" onClick=${() => go({ job: "times" })}><b>Times</b><span>Copying times off the timer · ${waitingFor(st, "times").length} waiting</span></button>
      </div>
      ${me.level === "volunteer" ? html`<button className="btn ghost block" onClick=${openBecome}>Become lead</button>` : null}
    </div></div>`;
  const back = html`<button className="back" aria-label="Back to jobs" onClick=${() => go({ job: null, race: null })}>‹</button>`;
  const title = { start: "Start line", finish: "Finish order", times: "Times" }[job];
  return html`<div className="scr"><div className="topbar">${back}<div className="title">${title}</div><${LeadBtn} ...${p} /></div>
    ${job === "start" ? html`<${C_Start} ...${p} />` : job === "finish" ? html`<${C_Finish} ...${p} />` : html`<${C_Times} ...${p} />`}</div>`;
}
function C_Start(p) {
  const { st, nav, go, mutate, save } = p;
  const r = nav.race ? st.races.find(x => x.id === nav.race) : null;
  const sl = useStartLine(st, r);
  const [evName, setEvName] = useState(null);
  const [step, setStep] = useState("type");
  useEffect(() => setStep("type"), [r && r.id]);
  if (!r) {
    const at = startLineRaces(st);
    if (!evName) return html`<div className="scroll">
      <h2 className="q">Which race is it?<small>Pick the event, then the section.</small></h2>
      ${at.length ? html`<div className="label">Already at the start line</div><div className="list">${at.map(x => html`<button key=${x.id} className="listbtn" onClick=${() => go({ race: x.id })}><span><b>${raceName(st, x)} · ${raceLabel(x)}</b></span><span className="chev">›</span></button>`)}</div><div className="label">Or a new race</div>` : null}
      <div className="numgrid" style=${{ gridTemplateColumns: "1fr 1fr" }}>${eventsByName(st).map(g => html`<button key=${g.name} className="bignum" style=${{ fontSize: 30 }} onClick=${() => setEvName(g.name)}>${g.name}</button>`)}</div>
    </div>`;
    const g = eventsByName(st).find(x => x.name === evName);
    return html`<div className="scroll"><h2 className="q">${evName}: which section?</h2>
      <div className="list">${g.evs.filter(e => e.stage === "open").map(e => html`<button key=${e.code} className="bignum" style=${{ fontSize: 28, minHeight: 64 }} onClick=${() => { let id; mutate(s => { id = newRace(s, e.code); }); setEvName(null); setTimeout(() => go({ race: id }), 0); }}>${e.section}</button>`)}</div>
      <button className="btn block" onClick=${() => setEvName(null)}>Back</button></div>`;
  }
  if (isLocked(st, r)) return html`<div className="scroll"><${RaceHead} st=${st} r=${r} /><${Locked} /></div>`;
  if (r.kind === "final") return html`<div className="scroll">
    <h2 className="q">Is everyone here?<small>${raceName(st, r)} · Final. Tap anyone who isn't.</small></h2>
    <div className="numgrid">${sl.list.map(x => html`<button key=${x.num} className="bignum" style=${x.absent ? { textDecoration: "line-through", opacity: .45 } : null} onClick=${() => sl.toggleAbsent(x.num)}>${x.num}</button>`)}</div>
    <button className="btn primary block" onClick=${() => save(() => { mutate(s => saveRunners(s, r, sl)); go({ race: null }); }, "Saved - final is ready at the finish")}>Everyone else is here</button></div>`;
  const n = sl.list.length;
  if (step === "check") return html`<div className="scroll">
    <h2 className="q">${n} runner${n === 1 ? "" : "s"}. Is that right?<small>${raceName(st, r)} · ${raceLabel(r)}</small></h2>
    <div className="placed">${sl.list.map((x, i) => html`<div key=${x.num} className="prow" style=${x.warning ? { background: "var(--warn-bg)", borderColor: "var(--warn-line)" } : null}><span className="pl">${i + 1}</span><span className="n">${x.num}</span>${x.warning ? html`<span className="pill warn">${WARN_TEXT[x.warning]}</span>` : null}<button className="ic" aria-label=${"Remove " + x.num} onClick=${() => sl.remove(x.num)}>✕</button></div>`)}</div>
    <button className="btn primary block" disabled=${!n} onClick=${() => save(() => { mutate(s => saveRunners(s, r, sl)); go({ race: null }); }, "Saved - race is ready at the finish")}>Yes, save</button>
    <button className="btn block" onClick=${() => setStep("type")}>Add someone</button></div>`;
  return html`<div className="scr"><div className="scroll">
    <h2 className="q">${n === 6 ? "Race is full" : `Runner ${n + 1}: wristband number?`}<small>${raceName(st, r)} · ${raceLabel(r)} · ${n} of 6</small></h2>
    ${n ? html`<div className="trail">${sl.list.map(x => html`<button key=${x.num} onClick=${() => sl.remove(x.num)} aria-label=${"Remove " + x.num}><b>${x.num}</b> ✕</button>`)}</div>` : null}
    <div className=${"display" + (sl.d ? "" : " empty")}>${sl.d || (n === 6 ? "6 of 6" : "Type the number")}</div>
    ${sl.refuse ? html`<div className="alert bad">${sl.refuse}</div>` : null}
    ${n < 6 ? html`<${Keypad} onDigit=${k => { sl.setRefuse(""); sl.setD(x => (x + k).slice(0, 4)); }} onBack=${() => sl.setD(x => x.slice(0, -1))} go=${() => sl.add()} goLabel="Next" goDisabled=${!sl.d} />` : null}
    <button className="btn primary block" disabled=${!n} onClick=${() => setStep("check")}>That's everyone</button>
  </div>${sl.w ? html`<${WarnSheet} w=${sl.w} onFix=${sl.fix} onKeep=${sl.keep} />` : null}</div>`;
}
function C_Finish(p) {
  const { st, nav, go, mutate, save } = p;
  const w = waitingFor(st, "finish");
  const r = nav.race ? st.races.find(x => x.id === nav.race) : w[0];
  const fo = useFinishOrder(r);
  const [step, setStep] = useState("ask");
  const [how, setHow] = useState({});
  const [qi, setQi] = useState(0);
  const [add, setAdd] = useState(false);
  const [pickOther, setPickOther] = useState(false);
  useEffect(() => { setStep(r && r.order ? "review" : "ask"); setHow({}); setQi(0); }, [r && r.id]);
  if (!r) return html`<div className="scroll"><h2 className="q">Nothing waiting<small>New races appear here when the start line saves them.</small></h2><${RaceLists} st=${st} job="finish" onPick=${id => go({ race: id })} /></div>`;
  if (pickOther) return html`<div className="scroll"><h2 className="q">Which race?</h2><${RaceLists} st=${st} job="finish" current=${r} onPick=${id => { setPickOther(false); go({ race: id }); }} /><button className="btn block" onClick=${() => setPickOther(false)}>Back</button></div>`;
  const head = html`<div className="who" style=${{ display: "flex", justifyContent: "space-between", gap: 8 }}><span><b style=${{ color: "var(--ink)" }}>${raceName(st, r)} (${r.event}) · ${raceLabel(r)}</b><br/>${r.runners.length} runners · checked in ${hhmm(r.checkedInAt)}</span><button className="btn" style=${{ minHeight: 40, fontSize: 14 }} onClick=${() => setPickOther(true)}>Other race</button></div>`;
  if (isLocked(st, r)) return html`<div className="scroll">${head}<${Locked} /></div>`;
  const doSave = () => save(() => { mutate(s => saveFinish(s, r, fo, how)); go({ race: null }); }, "Saved finish order");
  if (step === "ask") {
    const k = fo.placed.length + 1;
    return html`<div className="scr"><div className="scroll">${head}
      <h2 className="q">${fo.unplaced.length ? `Who came ${ord(k)}?` : "Everyone has a place"}</h2>
      ${fo.placed.length ? html`<div className="trail">${fo.placed.map((n, i) => html`<button key=${n} onClick=${() => fo.setPlaced(fo.placed.slice(0, i))} aria-label=${"Go back to " + ord(i + 1)}>${ord(i + 1)} <b>${n}</b></button>`)}</div>` : null}
      <div className="numgrid" style=${{ gridTemplateColumns: fo.unplaced.length > 4 ? "1fr 1fr" : "1fr" }}>${fo.unplaced.map(n => html`<button key=${n} className="bignum huge" onClick=${() => fo.tap(n)}>${n}</button>`)}</div>
      <button className="btn ghost block" onClick=${() => setAdd(true)}>+ Runner not on the list</button>
      ${fo.unplaced.length && fo.placed.length ? html`<button className="btn block" onClick=${() => { setQi(0); setStep("unplaced"); }}>Nobody else crossed the line</button>` : null}
      ${!fo.unplaced.length ? html`<button className="btn primary block" onClick=${() => setStep("review")}>Next</button>` : null}
    </div>${add ? html`<${AddRunnerSheet} st=${st} r=${r} list=${fo.all.map(n => ({ num: n }))} onClose=${() => setAdd(false)} onAdd=${x => { fo.setExtra(e => [...e, x]); setAdd(false); }} />` : null}</div>`;
  }
  if (step === "unplaced") {
    const n = fo.unplaced[qi];
    if (n == null) { setTimeout(() => setStep("review")); return null; }
    return html`<div className="scroll">${head}
      <h2 className="q">${n} has no place. What happened?</h2>
      <button className="btn block" style=${{ minHeight: 80 }} onClick=${() => { setHow(h => ({ ...h, [n]: "dnf" })); setQi(qi + 1); }}>Did not finish<br/><small style=${{ fontWeight: 400 }}>Started but didn't cross the line</small></button>
      <button className="btn block" style=${{ minHeight: 80 }} onClick=${() => { setHow(h => ({ ...h, [n]: "didnt" })); setQi(qi + 1); }}>Didn't run<br/><small style=${{ fontWeight: 400 }}>Never started; can run in a later race</small></button>
      <button className="btn ghost block" onClick=${() => setStep("ask")}>Back - they did finish</button></div>`;
  }
  return html`<div className="scroll">${head}
    <h2 className="q">Check the order</h2>

function C_Times(p) {
  const { st, nav, go, mutate, save } = p;
  const w = waitingFor(st, "times");
  const r = nav.race ? st.races.find(x => x.id === nav.race) : w[0];
  const tm = useTimes(r);
  const [i, setIRaw] = useState(0);
  const [fresh, setFresh] = useState(true);
  const setI = j => { setIRaw(j); setFresh(true); };
  const [review, setReview] = useState(false);
  const [pickOther, setPickOther] = useState(false);
  useEffect(() => { setI(0); setReview(!!(r && r.times)); }, [r && r.id]);
  if (!r) return html`<div className="scroll"><h2 className="q">Nothing waiting<small>Races appear here once the start line saves them.</small></h2><${RaceLists} st=${st} job="times" onPick=${id => go({ race: id })} /></div>`;
  if (pickOther) return html`<div className="scroll"><h2 className="q">Which race?</h2><${RaceLists} st=${st} job="times" current=${r} onPick=${id => { setPickOther(false); go({ race: id }); }} /><button className="btn block" onClick=${() => setPickOther(false)}>Back</button></div>`;
  const head = html`<div className="who" style=${{ display: "flex", justifyContent: "space-between", gap: 8 }}><span><b style=${{ color: "var(--ink)" }}>${raceName(st, r)} (${r.event}) · ${raceLabel(r)}</b><br/>${r.runners.length} runners · checked in ${hhmm(r.checkedInAt)}</span><button className="btn" style=${{ minHeight: 40, fontSize: 14 }} onClick=${() => setPickOther(true)}>Other race</button></div>`;
  if (isLocked(st, r)) return html`<div className="scroll">${head}<${Locked} /></div>`;
  const firstNF = tm.boxes.findIndex(b => b.nf);
  const lastTimed = firstNF < 0 ? tm.boxes.length - 1 : firstNF - 1;
  const b = tm.boxes[i];
  const mm = mismatch(r) && !review ? html`<div className="alert bad">Finish order has ${r.order.length} finishers, times have ${nonNull(r.times)} - check the recording</div>` : null;
  if (!review && b && !b.nf) {
    const isOoo = tm.ooo === i && !tm.kept;
    const nextStep = () => { if (i < lastTimed) setI(i + 1); else setReview(true); };
    return html`<div className="scroll">${head}${mm}
      <h2 className="q">${ord(i + 1)} place time?<small>Digits only, e.g. 1234 → 12.34</small></h2>
      <div className=${"display" + (b.d ? "" : " empty") + (isOoo ? " warn" : "")}>${fmtDigits(b.d) || "Type the time"}</div>
      ${isOoo ? html`<${OooWarn} tm=${tm} i=${i} />` : null}
      <${Keypad} onDigit=${k => { tm.setKept(false); tm.setDigits(i, fresh ? k : b.d + k); setFresh(false); }} onBack=${() => { tm.setDigits(i, b.d.slice(0, -1)); setFresh(false); }} go=${nextStep} goLabel="Next" goDisabled=${!b.d || isOoo} />
      <div className="row">
        ${i > 0 ? html`<button className="btn" onClick=${() => setI(i - 1)}>Back</button>` : null}
        <button className="btn" onClick=${() => { tm.setBoxes(bs => bs.map((x, j) => j >= i ? { nf: true, d: "" } : x)); setReview(true); }}>No more finishers</button>
      </div></div>`;
  }
  return html`<div className="scroll">${head}
    <h2 className="q">Check the times</h2>
    <div className="tlist">${tm.boxes.map((x, j) => html`<button key=${j} className=${"trow" + (x.nf ? " nf" : "") + (tm.ooo === j && !tm.kept ? " warn" : "")} style=${{ textAlign: "left" }} onClick=${() => { if (!x.nf) { setI(j); setReview(false); } }}>
      <span className="pl">${ord(j + 1)}</span>${x.nf ? html`<span className="nfl">No finisher</span>` : html`<span className="tval">${fmtDigits(x.d) || "-"}</span>`}<span className="who">${x.nf ? "" : "edit"}</span></button>`)}</div>
    ${tm.ooo >= 0 && !tm.kept ? html`<${OooWarn} tm=${tm} i=${tm.ooo} />` : null}
    <${MismatchNote} st=${st} r=${r} tm=${tm} />
    ${firstNF >= 0 ? html`<button className="btn block" onClick=${() => { tm.unmarkNF(); setI(firstNF); setReview(false); }}>${ord(firstNF + 1)} did finish</button>` : null}
    <button className="btn primary block" disabled=${!tm.filled || (tm.ooo >= 0 && !tm.kept)} onClick=${() => save(() => { mutate(s => saveTimes(s, r, tm)); go({ race: null }); }, "Saved times")}>Save times</button></div>`;
}

function TieSheet({ time, rk, note, mutate, onClose, toast, code }) {

function CompleteSheet({ st, rk, label, note, mutate, onClose, toast, code }) {

  if (rk.entries.some(x => x.ranTwice && x.highlighted)) must.push("A runner ran twice in the highlighted places");
  rk.notRanked.filter(r => !r.clash).forEach(r => must.push(`${raceLabel(r)} not fully recorded (${waitReason(r)}) - finish it or delete it`));
  const look = rk.entries.filter(x => x.warning && !x.checked).map(x => `${x.num} (${raceLabel(x.race)}): ${WARN_TEXT[x.warning]}`);
  const creates = label === "Heats complete" ? `Finals line-up: ${rk.entries.slice(0, 6).map((x, i) => `${i + 1}. ${x.num}`).join("  ")}`
    : label === "Event complete" ? `Medal places: ${rk.entries.slice(0, 3).map((x, i) => `${ord(i + 1)} ${x.num}`).join(", ")}`
    : `Final positions: ${(rk.finalRows || []).slice(0, 3).map(x => `${ord(x.pos)} ${x.num}`).join(", ")}`;
  const confirm = () => {
    mutate(s => {
      const ev = s.events.find(x => x.code === code);
      if (label === "Heats complete") { ev.stage = "heats_complete"; const r = mkRace(code, "final", 1, rk.entries.slice(0, 6).map(x => x.num), nowSecs(), { atStart: true }); s.races.push(r); note(s, `marked heats complete; final created with ${rk.entries.slice(0, 6).map(x => x.num).join(", ")}`); }
      else { ev.stage = "complete"; note(s, `marked ${label.toLowerCase()}`); }
    });
    toast(label === "Heats complete" ? "Final is at the start line" : "Marked complete"); onClose();
  };
  return html`<${Sheet} onClose=${onClose}>
    <h3>${label}: ${e.name} ${e.section}</h3>
    <div className="checks">
      <div className=${"checkgrp " + (must.length ? "bad" : "ok")}><h4>Must settle first${must.length ? ` (${must.length})` : " - nothing"}</h4>${must.length ? html`<ul>${must.map((m, i) => html`<li key=${i}>${m}</li>`)}</ul>` : null}</div>
      <div className=${"checkgrp " + (look.length ? "warn" : "ok")}><h4>Worth a look${look.length ? ` (${look.length})` : " - nothing"}</h4>${look.length ? html`<ul>${look.map((m, i) => html`<li key=${i}>${m}</li>`)}</ul>` : null}</div>
      <div className="checkgrp ok"><h4>What this creates</h4><div className="num" style=${{ fontSize: 18 }}>${creates}</div></div>
    </div>
    <button className="btn primary block" disabled=${must.length > 0} onClick=${confirm}>Confirm</button>
    <button className="btn block" onClick=${onClose}>Cancel</button>
  <//>`;
}
function RaceSheet({ st, id, onClose, mutate, toast, me }) {
  const r = st.races.find(x => x.id === id);
  if (!r) return null;
  const e = evOf(st, r);
  const note = (s, text) => s.events.find(x => x.code === r.event).notes.push({ t: nowSecs(), who: me.name, text });
  const act = (fn, msg) => { mutate(fn); toast(msg); onClose(); };
  return html`<${Sheet} onClose=${onClose}>
    <h3>${raceName(st, r)} (${r.event}) · ${raceLabel(r)}</h3>
    <p>Checked in ${hhmm(r.checkedInAt)} · ${r.runners.length} runners</p>
    ${r.clash ? html`<div className="alert bad">Two versions of the ${r.clash.part.toLowerCase()}. Pick the one that stands.</div>
      ${[r.clash.a, r.clash.b].map((v, i) => html`<button key=${i} className="listbtn" onClick=${() => act(s => { const x = s.races.find(y => y.id === id); x.order = v.order; x.clash = null; note(s, `picked ${v.who}'s finish order for ${raceLabel(r)}`); }, "Version picked")}><span><b>${v.who}'s version</b><br/><span className="num" style=${{ fontSize: 20 }}>${v.order.join(" · ")}</span></span><span className="chev">Pick</span></button>`)}` : null}
    <div className="lbwrap"><table className="lb"><thead><tr><th>Place</th><th>Number</th><th>Time</th></tr></thead><tbody>
      ${Array.from({ length: Math.max(r.order ? r.order.length : 0, r.times ? r.times.length : 0) }, (_, i) => html`<tr key=${i} className=${r.outOfOrder && r.times && i > 0 && r.times[i] != null && r.times[i] < r.times[i - 1] ? "hl" : ""}><td>${ord(i + 1)}</td><td className="big">${r.order && r.order[i] != null ? r.order[i] : "-"}</td><td className="big">${r.times ? (r.times[i] == null ? "No finisher" : fmtHund(r.times[i])) : "-"}</td></tr>`)}
      ${Object.keys(r.unplaced).map(n => html`<tr key=${n} className="out"><td>-</td><td className="big">${n}</td><td>Did not finish</td></tr>`)}
    </tbody></table></div>
    ${r.outOfOrder ? html`<div className="alert warn">Times out of order - check the SprintTimer recording.</div>
      <button className="btn block" onClick=${() => act(s => { const x = s.races.find(y => y.id === id); x.times = [...x.times].sort((a, b) => (a ?? 1e9) - (b ?? 1e9)); x.outOfOrder = false; note(s, `corrected times for ${raceLabel(r)} from the recording`); }, "Times corrected")}>Correct times from the recording</button>` : null}
    ${mismatch(r) ? html`<div className="alert bad">Finish order has ${r.order.length} finishers, times have ${nonNull(r.times)}</div>
      <button className="btn block" onClick=${() => act(s => { const x = s.races.find(y => y.id === id); x.times = x.times.map((t, i) => t == null && i < x.order.length ? 3500 : t); note(s, `corrected times for ${raceLabel(r)} from the recording`); }, "Prototype: typed the missing time")}>Correct times from the recording</button>` : null}
    ${(r.outOfOrder || mismatch(r)) ? html`<button className="btn danger block" onClick=${() => act(s => { const x = s.races.find(y => y.id === id); x.deleted = "re-run"; const n = mkRace(x.event, x.kind, s.races.filter(y => y.event === x.event && y.kind !== "final").length + 1, x.runners.map(y => y.num), nowSecs(), { atStart: true }); s.races.push(n); note(s, `called a re-run of ${raceLabel(r)}; new ${raceLabel(n)} at the start line`); }, "Re-run: new race at the start line")}>Re-run the race</button>` : null}
    ${r.runners.some(x => x.addedAtFinish) ? html`<p>${r.runners.filter(x => x.addedAtFinish).map(x => x.num).join(", ")} added at the finish.</p>` : null}
    <div className="row"><button className="btn" onClick=${() => act(s => { s.races.find(y => y.id === id).deleted = "soft"; note(s, `moved ${raceLabel(r)} to Deleted races`); }, "Moved to Deleted races")}>Delete</button><button className="btn" onClick=${onClose}>Close</button></div>
  <//>`;
}
function DayTab({ st, me, mutate, toast }) {
  const [word, setWord] = useState("");
  const [exported, setExported] = useState(false);
  const code = () => Math.random().toString(36).slice(2, 8).toUpperCase().replace(/[O0I1]/g, "7");
  return html`<div className="scroll"><div className="lgrid two">
    <div style=${{ display: "flex", flexDirection: "column", gap: 12, minWidth: 0 }}>
      <div className="card" style=${{ display: "flex", flexDirection: "column", gap: 6 }}><div className="label">Day code</div><div className="codebig">${st.dayCode}</div><button className="btn" onClick=${() => { mutate(s => { s.dayCode = String(1000 + Math.floor(Math.random() * 9000)); }); toast("New day code: joined phones stay in"); }}>Make new day code</button></div>
      <div className="card" style=${{ display: "flex", flexDirection: "column", gap: 6 }}><div className="label">Lead code</div><div className="codebig">${st.leadCode}</div><button className="btn" onClick=${() => { mutate(s => { s.leadCode = code(); s.phones.forEach(p => { if (p.level === "lead" && p.name !== me.name) p.level = "volunteer"; }); }); toast("New lead code: other leads are volunteers again"); }}>Make new lead code</button></div>
      <div className="card" style=${{ display: "flex", flexDirection: "column", gap: 6 }}><div className="label">Event list</div><p style=${{ margin: 0 }}>${st.events.length} running events confirmed for today (R1-R18, R23, R24). Relays stay on paper.</p></div>
    </div>
    <div style=${{ display: "flex", flexDirection: "column", gap: 12, minWidth: 0 }}>
      <div className="label">Joined phones (${st.phones.length})</div>
      <div className="phones">${st.phones.map(p => html`<div key=${p.name}><b>${p.name}</b><span className=${"pill " + (p.level === "scoring" ? "info" : p.level === "lead" ? "ok" : "grey")}>${p.level === "scoring" ? "Scoring team" : p.level === "lead" ? "Lead" : "Volunteer"}</span>
        ${p.level === "lead" ? html`<button onClick=${() => mutate(s => { s.phones.find(x => x.name === p.name).level = "scoring"; })}>Make scoring team</button>` : null}
        ${p.level === "scoring" && p.name !== me.name ? html`<button onClick=${() => mutate(s => { s.phones.find(x => x.name === p.name).level = "lead"; })}>Remove from scoring team</button>` : null}
        ${p.name !== me.name ? html`<button onClick=${() => { mutate(s => { s.phones = s.phones.filter(x => x.name !== p.name); }); toast(p.name + "'s phone removed"); }}>Remove</button>` : null}</div>`)}</div>
      <button className="btn primary block" onClick=${() => { setExported(true); toast("Prototype: downloads the 4-sheet day export"); }}>Download day export</button>
      <div className="card" style=${{ display: "flex", flexDirection: "column", gap: 8, borderColor: "var(--bad)" }}>
        <div className="label" style=${{ color: "var(--bad)" }}>Start new day</div>
        <p style=${{ margin: 0 }}>Clears every race, name and code. ${exported ? "Day export downloaded." : "Download the day export first."} Type <b>CLEAR</b> to confirm.</p>
        <input id="clear-word" className="tinput" value=${word} onChange=${e => setWord(e.target.value)} placeholder="CLEAR" />
        <button className="btn danger block" disabled=${!exported || word !== "CLEAR"} onClick=${() => toast("Prototype: would clear the day and make new codes")}>Start new day</button>
      </div>
    </div></div></div>`;
}

/* ======================================================================
   Prototype shell: variant switcher, jump menu, state panel
   ====================================================================== */
const VARIANTS = [
  { k: "A", name: "Job tiles, lists", desc: "Home screen of three big job tiles. Each job is one scrolling page: placed list with arrows above number buttons; one time box per place using the phone's own number keyboard." },
  { k: "B", name: "Bottom tabs, keypad", desc: "No home screen: jobs are tabs along the bottom, races are a swipeable strip along the top. A big on-screen keypad stays docked at the bottom, like a calculator." },
  { k: "C", name: "One question at a time", desc: "Each screen asks one thing: \"Who came 2nd?\", \"3rd place time?\". A check screen at the end before Save. Slowest, but hardest to get wrong." },
];
function readVariant() { const h = (location.hash || "").replace("#", "").toUpperCase(); return VARIANTS.some(v => v.k === h) ? h : "A"; }
function App() {
  const [st, setSt] = useState(seed);
  const [variant, setVariant] = useState(readVariant);
  const [me, setMe] = useState({ name: "Maryam", level: "lead" });
  const [screen, setScreen] = useState("jobs"); // join | jobs | lead
  const [nav, setNav] = useState({ job: null, race: null });
  const [toastMsg, setToastMsg] = useState(null);
  const [become, setBecome] = useState(false);
  const [drawer, setDrawer] = useState(false);
  const [, setTick] = useState(0);
  const tRef = useRef();
  useEffect(() => { const t = setInterval(() => setTick(x => x + 1), 5000); return () => clearInterval(t); }, []);
  const mutate = fn => setSt(s => { const c = structuredClone(s); fn(c); return c; });
  const toast = m => { setToastMsg(m); clearTimeout(tRef.current); tRef.current = setTimeout(() => setToastMsg(null), 1800); };
  const save = useSaver(toast);
  const go = patch => setNav(n => ({ ...n, race: patch.job !== undefined && patch.race === undefined ? null : n.race, ...patch }));
  const switchTo = k => { setVariant(k); setNav({ job: null, race: null }); try { history.replaceState(null, "", "#" + k); } catch (e) { } };
  const cycle = d => { const i = VARIANTS.findIndex(v => v.k === variant); switchTo(VARIANTS[(i + d + VARIANTS.length) % VARIANTS.length].k); };
  useEffect(() => {
    const h = e => { const t = e.target; if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return; if (e.key === "ArrowLeft") cycle(-1); if (e.key === "ArrowRight") cycle(1); };
    window.addEventListener("keydown", h); return () => window.removeEventListener("keydown", h);
  });
  const jump = (what) => {
    setDrawer(false); setNav({ job: null, race: null });
    if (what === "join") { setScreen("join"); }
    if (what === "volunteer") { setMe({ name: "Ahmed", level: "volunteer" }); setScreen("jobs"); }
    if (what === "lead") { setMe({ name: "Maryam", level: "lead" }); setScreen("jobs"); }
    if (what === "leadarea") { setMe({ name: "Maryam", level: "lead" }); setScreen("lead"); }
    if (what === "scoring") { setMe({ name: "Aisha", level: "scoring" }); setScreen("lead"); }
    if (what === "reset") { setSt(seed()); setScreen("jobs"); toast("Sample data reset"); }
  };
  const props = { st, me, nav, go, mutate, save, toast, refresh: () => toast("Up to date"), openLead: () => setScreen("lead"), openBecome: () => setBecome(true) };
  const V = { A: A_App, B: B_App, C: C_App }[variant];
  const v = VARIANTS.find(x => x.k === variant);
  const wide = screen === "lead";
  const side = html`<${SidePanel} st=${st} v=${v} variant=${variant} switchTo=${switchTo} jump=${jump} me=${me} />`;
  return html`<div className="stage">
    <div className=${"phone" + (wide ? " wide" : "")}>
      ${screen === "join" ? html`<div className="scr"><${Join} st=${st} onJoin=${name => { mutate(s => { s.phones.push({ name, level: "volunteer" }); }); setMe({ name, level: "volunteer" }); setScreen("jobs"); toast("Joined as " + name); }} /></div>`
      : screen === "lead" ? html`<${Lead} ...${props} close=${() => setScreen("jobs")} />`
      : html`<${V} ...${props} />`}
      ${become ? html`<${BecomeLead} st=${st} onClose=${() => setBecome(false)} onDone=${lvl => { setBecome(false); setMe(m => ({ ...m, level: lvl })); mutate(s => { const p = s.phones.find(x => x.name === me.name); if (p) p.level = lvl; }); toast(lvl === "scoring" ? "You're on the scoring team" : "You're a lead"); }} />` : null}
      ${toastMsg ? html`<div className="toast" role="status">${toastMsg}</div>` : null}
    </div>
    <aside className="side">${side}</aside>
    <div className="protobar" role="toolbar" aria-label="Prototype variant switcher">
      <button onClick=${() => cycle(-1)} aria-label="Previous variant">←</button>
      <span className="lbl"><b>${v.k}</b> <small>${v.name}</small></span>
      <button onClick=${() => cycle(1)} aria-label="Next variant">→</button>
      <button className="menu-btn" onClick=${() => setDrawer(d => !d)}>${drawer ? "Close" : "Menu"}</button>
    </div>
    ${drawer ? html`<div className="drawer side" style=${{ display: "flex", width: "auto" }}>${side}</div>` : null}
  </div>`;
}
function SidePanel({ st, v, variant, switchTo, jump, me }) {
  const rs = live(st);
  return html`
    <div><div className="label">Prototype · throwaway</div><h1>Race-day phone screens</h1></div>
    <p>Three ways the volunteer jobs could look. The join screen and the Lead area are the same in all three. Sample data: South day 1, about ${hhmm(START)}.</p>
    <h2>Variants</h2>
    <div className="vlist">${VARIANTS.map(x => html`<button key=${x.k} className="vbtn" aria-pressed=${x.k === variant} onClick=${() => switchTo(x.k)}><b>${x.k} · ${x.name}</b><br/>${x.desc}</button>`)}</div>
    <h2>Jump to</h2>
    <div className="jump">
      <button onClick=${() => jump("join")}>Join screen</button>
      <button onClick=${() => jump("volunteer")}>Volunteer (Ahmed)</button>
      <button onClick=${() => jump("lead")}>Zone lead jobs (Maryam)</button>
      <button onClick=${() => jump("leadarea")}>Lead area</button>
      <button onClick=${() => jump("scoring")}>Scoring team (Aisha)</button>
      <button onClick=${() => jump("reset")}>Reset sample data</button>
    </div>
    <h2>Codes</h2>
    <p>Day code <code>${st.dayCode}</code> · lead code <code>${st.leadCode}</code> · owner password <code>${OWNER_PASSWORD}</code>. Try joining as "Ahmed" to see the name refusal.</p>
    <h2>Things to try</h2>
    <p>Finish order: save with someone unplaced. Times: type 1010 then 990 for an out-of-order warning; mark No finisher. Start line: type 3045 in a Cubs race (wrong section), 7777 (unknown) or the same number twice. Lead: settle the 60m Girl Cubs tie, then Heats complete.</p>
    <h2>Live data · ${me.name} (${me.level})</h2>
    <div className="statebox">${rs.map(r => html`<div key=${r.id}><b>${r.event} ${raceLabel(r)}</b> · ${r.runners.length} in · order ${r.order ? "✓" : "-"} · times ${r.times ? nonNull(r.times) + "/" + r.times.length : "-"}${r.clash ? " · clash" : ""}${r.outOfOrder ? " · out of order" : ""}${mismatch(r) ? " · counts differ" : ""}${isLocked(st, r) ? " · locked" : ""}</div>`)}</div>
  `;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
