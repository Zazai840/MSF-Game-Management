<title>Running Zone Race Day</title>
<!--
  PROTOTYPE - throwaway. Answers "Race-day phone screens prototype" (issue 14 on the
  Running Zone app v1 spec map). Not production code: no tests, in-memory data only.

  Plan: three variants of the volunteer job screens (Start line, Finish order, Times),
  switchable from the prototype bar (or ← / → keys, or #A #B #C in the URL).
  The join screen, Become lead and the Lead area (Needs you / Results / Day) are built
  once and shared by all variants, because their structure was already decided.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: a phone frame centred on desktop (wide for the Lead area), full screen on a phone.
   Track-side legibility first: big targets, hyperlegible body type, condensed numerals like a race bib. */
:root {
  --bg: #EEF1F6;
  --surface: #FFFFFF;
  --surface-2: #F5F7FB;
  --ink: #131A2C;
  --muted: #586179;
  --line: #D6DCE7;
  --accent: #1D4ED8;
  --accent-ink: #FFFFFF;
  --accent-soft: #E2E9FC;
  --warn: #9A5B00;
  --warn-bg: #FFF0D2;
  --warn-line: #F0B44C;
  --bad: #B42318;
  --bad-bg: #FDE6E3;
  --ok: #17703F;
  --ok-bg: #DCF2E4;
  --hl: #E6EDFF;
  --medal: #FFF4CF;
  --grey-flag: #8A93A8;
  --proto-bg: #11151F;
  --proto-fg: #F4F6FA;
  --proto-muted: #A8B0C2;
  --frame: #1B2133;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-num: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C101A; --surface: #151B2A; --surface-2: #1B2234; --ink: #EDF0F7; --muted: #9CA5BA;
    --line: #2B3349; --accent: #7397FF; --accent-ink: #0A0F1D; --accent-soft: #1D2A50;
    --warn: #FFC266; --warn-bg: #36270B; --warn-line: #9C6B16; --bad: #FF8A80; --bad-bg: #3B1714;
    --ok: #6BD69A; --ok-bg: #0F2E1C; --hl: #1A2442; --medal: #342F11; --grey-flag: #6E7790;
    --proto-bg: #EEF1F6; --proto-fg: #11151F; --proto-muted: #4A5266; --frame: #2F3854;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C101A; --surface: #151B2A; --surface-2: #1B2234; --ink: #EDF0F7; --muted: #9CA5BA;
  --line: #2B3349; --accent: #7397FF; --accent-ink: #0A0F1D; --accent-soft: #1D2A50;
  --warn: #FFC266; --warn-bg: #36270B; --warn-line: #9C6B16; --bad: #FF8A80; --bad-bg: #3B1714;
  --ok: #6BD69A; --ok-bg: #0F2E1C; --hl: #1A2442; --medal: #342F11; --grey-flag: #6E7790;
  --proto-bg: #EEF1F6; --proto-fg: #11151F; --proto-muted: #4A5266; --frame: #2F3854;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.4; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: .01em; }

/* ---------- stage ---------- */
#root { height: 100%; }
.stage { min-height: 100%; display: flex; gap: 28px; justify-content: center; align-items: flex-start; padding: 24px 16px 96px; }
.phone { position: relative; width: 390px; height: min(844px, calc(100vh - 130px)); min-height: 560px; border: 10px solid var(--frame); border-radius: 40px; background: var(--bg); overflow: hidden; display: flex; flex-direction: column; flex: none; transition: width .2s; }
.phone.wide { width: min(1040px, calc(100vw - 380px)); border-radius: 22px; }
.side { width: 300px; flex: none; max-height: calc(100vh - 120px); overflow-y: auto; padding-right: 4px; display: flex; flex-direction: column; gap: 14px; font-size: 14px; color: var(--muted); }
.side h1 { font-family: var(--font-num); font-weight: 700; font-size: 30px; line-height: 1.05; color: var(--ink); margin: 0; text-wrap: balance; }
.side h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; margin: 6px 0 0; color: var(--ink); }
.side p { margin: 0; }
.side .jump { display: flex; flex-wrap: wrap; gap: 6px; }
.side .jump button, .side .vbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; }
.side .vlist { display: flex; flex-direction: column; gap: 6px; }
.side .vbtn { text-align: left; border-radius: 10px; padding: 8px 10px; }
.side .vbtn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
.side .vbtn b { color: var(--ink); }
.side code { font-family: var(--font-num); font-size: 16px; color: var(--ink); background: var(--surface); padding: 1px 6px; border-radius: 6px; border: 1px solid var(--line); }
.statebox { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-size: 12px; max-height: 260px; overflow: auto; }
.statebox div { white-space: nowrap; }

.protobar { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 50; display: flex; align-items: center; gap: 4px; background: var(--proto-bg); color: var(--proto-fg); border-radius: 999px; padding: 6px; box-shadow: 0 8px 28px rgb(0 0 0 / .28); font-size: 14px; }
.protobar button { background: transparent; border: 0; color: var(--proto-fg); border-radius: 999px; padding: 6px 12px; min-height: 36px; }
.protobar button:hover { background: rgb(127 127 127 / .22); }
.protobar .lbl { padding: 0 8px; white-space: nowrap; }
.protobar .lbl small { color: var(--proto-muted); }
.protobar .menu-btn { display: none; }

@media (max-width: 760px) {
  .stage { padding: 0; display: block; height: 100%; }
  .side { display: none; }
  .phone, .phone.wide { width: 100%; height: 100%; min-height: 0; border: 0; border-radius: 0; padding-top: 44px; }
  .protobar { top: 0; bottom: auto; left: 0; right: 0; transform: none; border-radius: 0; justify-content: space-between; padding: 4px 8px; box-shadow: none; font-size: 13px; height: 44px; }
  .protobar .menu-btn { display: inline-block; }
}
.drawer.side { max-height: none; }
.drawer { position: fixed; inset: 44px 0 0 0; z-index: 49; background: var(--bg); padding: 16px; overflow: auto; display: flex; flex-direction: column; gap: 14px; }

/* ---------- app chrome ---------- */
.scr { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.topbar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--line); min-height: 58px; }
.topbar .title { flex: 1; min-width: 0; font-weight: 700; font-size: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar .back { border: 0; background: var(--surface-2); border-radius: 12px; min-width: 44px; height: 44px; font-size: 22px; line-height: 1; }
.leadbtn { position: relative; border: 1.5px solid var(--ink); background: var(--surface); border-radius: 12px; height: 44px; padding: 0 14px; font-weight: 700; }
.leadbtn .count { position: absolute; top: -8px; right: -8px; background: var(--bad); color: #fff; border-radius: 999px; min-width: 22px; height: 22px; font-size: 13px; display: grid; place-items: center; padding: 0 5px; }
.who { font-size: 13px; color: var(--muted); }
.updated { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.updated button { border: 0; background: none; color: var(--accent); font-size: 13px; padding: 4px 0; }

.btn { border: 0; border-radius: var(--r); min-height: 56px; padding: 0 18px; font-weight: 700; font-size: 18px; background: var(--surface-2); color: var(--ink); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.warn { background: var(--warn-bg); color: var(--warn); border: 2px solid var(--warn-line); }
.btn.danger { background: var(--bad-bg); color: var(--bad); }
.btn.ghost { background: transparent; border: 1.5px dashed var(--line); color: var(--muted); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 10px; align-items: center; }
.row > .btn { flex: 1; }
.label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.racehead { background: var(--surface); border-radius: var(--r); padding: 14px 16px; border: 2px solid var(--ink); display: flex; flex-direction: column; gap: 2px; }
.racehead .ev { font-family: var(--font-num); font-weight: 700; font-size: 28px; line-height: 1.05; }
.racehead .ev .code { color: var(--muted); font-weight: 600; }
.racehead .meta { color: var(--muted); font-size: 15px; }
.racehead.locked { border-color: var(--line); background: var(--surface-2); }
.lock { background: var(--surface-2); border: 1.5px solid var(--line); border-radius: var(--r); padding: 14px; font-weight: 700; display: flex; gap: 10px; align-items: center; }
.alert { border-radius: var(--r); padding: 12px 14px; font-weight: 700; }
.alert.warn { background: var(--warn-bg); color: var(--warn); border: 1.5px solid var(--warn-line); }
.alert.bad { background: var(--bad-bg); color: var(--bad); }
.alert.ok { background: var(--ok-bg); color: var(--ok); }
.list { display: flex; flex-direction: column; gap: 8px; }
.listbtn { display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; min-height: 52px; }
.listbtn .sub { color: var(--muted); font-size: 14px; }
.listbtn .chev { color: var(--muted); font-size: 20px; }
.pill { display: inline-flex; align-items: center; border-radius: 999px; padding: 2px 9px; font-size: 13px; font-weight: 700; white-space: nowrap; }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.info { background: var(--accent-soft); color: var(--accent); }
.pill.grey { background: var(--surface-2); color: var(--grey-flag); }
.toast { position: absolute; left: 16px; right: 16px; bottom: 20px; z-index: 30; background: var(--ink); color: var(--surface); border-radius: 12px; padding: 14px 16px; font-weight: 700; text-align: center; box-shadow: 0 6px 20px rgb(0 0 0 / .25); }
.toast.bad { background: var(--bad); color: #fff; }

/* sheet */
.sheet-bg { position: absolute; inset: 0; background: rgb(10 14 24 / .5); z-index: 20; display: flex; align-items: flex-end; }
.sheet { background: var(--surface); width: 100%; border-radius: 22px 22px 0 0; padding: 18px 16px 22px; display: flex; flex-direction: column; gap: 12px; max-height: 88%; overflow-y: auto; }
.sheet h3 { margin: 0; font-size: 20px; text-wrap: balance; }
.sheet p { margin: 0; color: var(--muted); }
.phone.wide .sheet-bg { align-items: center; justify-content: center; }
.phone.wide .sheet { max-width: 520px; border-radius: 18px; }

/* number keypad */
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.keypad button { min-height: 58px; border: 0; border-radius: 12px; background: var(--surface); font-family: var(--font-num); font-weight: 600; font-size: 30px; box-shadow: inset 0 0 0 1px var(--line); }
.keypad button.fn { font-family: var(--font-body); font-size: 16px; font-weight: 700; background: var(--surface-2); }
.keypad button.go { background: var(--accent); color: var(--accent-ink); box-shadow: none; }
.display { font-family: var(--font-num); font-weight: 700; font-size: 52px; line-height: 1; text-align: center; padding: 10px; border-radius: var(--r); background: var(--surface); border: 2px solid var(--ink); min-height: 76px; display: flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; }
.display.empty { color: var(--muted); font-size: 22px; font-family: var(--font-body); font-weight: 400; }
.display.warn { border-color: var(--warn-line); background: var(--warn-bg); color: var(--warn); }

/* runner chips (start line) */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 8px; border-radius: 12px; background: var(--surface); border: 1.5px solid var(--line); padding: 6px 6px 6px 12px; }
.chip .n { font-family: var(--font-num); font-weight: 700; font-size: 26px; }
.chip.warn { border-color: var(--warn-line); background: var(--warn-bg); }
.chip.absent .n { text-decoration: line-through; color: var(--muted); }
.chip button { border: 0; background: var(--surface-2); border-radius: 8px; width: 34px; height: 34px; font-size: 18px; }
.slots { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.slot { height: 10px; border-radius: 4px; background: var(--line); }
.slot.on { background: var(--accent); }

/* finish order */
.numgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.bignum { min-height: 76px; border-radius: var(--r); border: 2px solid var(--ink); background: var(--surface); font-family: var(--font-num); font-weight: 700; font-size: 38px; }
.bignum.huge { min-height: 104px; font-size: 52px; }
.placed { display: flex; flex-direction: column; gap: 6px; }
.prow { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 6px 6px 6px 10px; }
.prow .pl { font-family: var(--font-num); font-weight: 700; font-size: 20px; width: 42px; color: var(--accent); }
.prow .n { font-family: var(--font-num); font-weight: 700; font-size: 30px; flex: 1; }
.prow .ic { border: 0; background: var(--surface-2); border-radius: 10px; width: 44px; height: 44px; font-size: 18px; }
.prow.empty { border-style: dashed; color: var(--muted); min-height: 58px; }
.prow.empty .n { font-family: var(--font-body); font-size: 15px; font-weight: 400; }

/* times */
.trow { display: grid; grid-template-columns: 48px 1fr auto; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
.trow .pl { font-family: var(--font-num); font-weight: 700; font-size: 22px; color: var(--accent); }
.trow input { width: 100%; border: 2px solid var(--line); border-radius: 10px; height: 52px; padding: 0 12px; font-family: var(--font-num); font-size: 28px; font-weight: 600; background: var(--surface-2); }
.trow input::placeholder { font-family: var(--font-body); font-size: 15px; font-weight: 400; color: var(--muted); }
.trow .fmt { font-family: var(--font-num); font-weight: 700; font-size: 26px; min-width: 76px; text-align: right; }
.trow.nf { background: var(--surface-2); color: var(--muted); }
.trow.nf .nfl { font-weight: 700; }
.trow.warn { border-color: var(--warn-line); background: var(--warn-bg); }
.trow.cur { border: 2px solid var(--accent); }
.trow .tval { font-family: var(--font-num); font-weight: 700; font-size: 30px; }

/* variant B: tabs + strip */
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs button { border: 0; background: none; min-height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 13px; font-weight: 700; color: var(--muted); position: relative; }
.tabs button .ico { font-size: 22px; line-height: 1; }
.tabs button[aria-current="true"] { color: var(--accent); }
.tabs button[aria-current="true"]::before { content: ""; position: absolute; top: 0; left: 22%; right: 22%; height: 3px; background: var(--accent); border-radius: 0 0 3px 3px; }
.tabs .badge { position: absolute; top: 6px; right: calc(50% - 26px); background: var(--bad); color: #fff; border-radius: 999px; font-size: 11px; min-width: 18px; height: 18px; display: grid; place-items: center; padding: 0 4px; }
.strip { display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); scrollbar-width: none; }
.strip button { flex: none; border: 1.5px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 6px 12px; text-align: left; min-width: 116px; }
.strip button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.strip button b { display: block; font-family: var(--font-num); font-size: 19px; }
.strip button small { color: var(--muted); font-size: 12px; }
.tlist { display: flex; flex-direction: column; gap: 6px; }
.dock { background: var(--surface-2); border-top: 1px solid var(--line); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.dock .keypad button { min-height: 50px; font-size: 26px; }
.dock .btn:not(.primary) { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.brow { display: flex; align-items: center; gap: 10px; border-radius: var(--r); border: 2px solid var(--ink); background: var(--surface); padding: 8px 10px; min-height: 66px; text-align: left; width: 100%; }
.brow .badge-pl { width: 52px; height: 48px; border-radius: 10px; display: grid; place-items: center; font-family: var(--font-num); font-weight: 700; font-size: 22px; background: var(--surface-2); color: var(--muted); }
.brow.on .badge-pl { background: var(--accent); color: var(--accent-ink); }
.brow .n { font-family: var(--font-num); font-weight: 700; font-size: 34px; flex: 1; }
.brow.on { border-color: var(--accent); }

/* variant C: wizard */
.q { font-family: var(--font-num); font-weight: 700; font-size: 40px; line-height: 1.05; margin: 0; text-wrap: balance; }
.q small { display: block; font-family: var(--font-body); font-weight: 400; font-size: 16px; color: var(--muted); margin-top: 4px; }
.trail { display: flex; flex-wrap: wrap; gap: 6px; }
.trail button { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 4px 10px; font-size: 14px; }
.trail button b { font-family: var(--font-num); font-size: 20px; }
.homeC { display: flex; flex-direction: column; gap: 12px; }
.homeC .job { min-height: 112px; border-radius: 20px; border: 2px solid var(--ink); background: var(--surface); text-align: left; padding: 16px 18px; display: flex; flex-direction: column; justify-content: center; }
.homeC .job b { font-family: var(--font-num); font-size: 36px; line-height: 1; }
.homeC .job span { color: var(--muted); }

/* variant A: tiles */
.tiles { display: flex; flex-direction: column; gap: 12px; }
.tile { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 12px; border-radius: 18px; border: 0; background: var(--accent); color: var(--accent-ink); text-align: left; padding: 18px; min-height: 104px; }
.tile b { font-size: 24px; }
.tile span { opacity: .85; font-size: 15px; }
.tile .cnt { grid-row: span 2; font-family: var(--font-num); font-weight: 700; font-size: 44px; line-height: 1; text-align: right; }
.tile .cnt small { display: block; font-family: var(--font-body); font-size: 12px; font-weight: 400; }

/* join */
.join { padding: 28px 20px; display: flex; flex-direction: column; gap: 16px; flex: 1; overflow-y: auto; }
.join .brand { font-family: var(--font-num); font-weight: 700; font-size: 44px; line-height: 1; }
.join .brand span { display: block; font-size: 18px; color: var(--muted); font-family: var(--font-body); font-weight: 400; margin-top: 6px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field input { height: 58px; border-radius: var(--r); border: 2px solid var(--line); background: var(--surface); padding: 0 16px; font-size: 20px; }
.field input.code { font-family: var(--font-num); font-size: 34px; letter-spacing: .3em; font-weight: 700; }
.field .err { color: var(--bad); font-weight: 700; font-size: 15px; }
.lane { height: 6px; background: repeating-linear-gradient(90deg, var(--line) 0 28px, transparent 28px 40px); border-radius: 3px; }

/* lead area */
.ltabs { display: flex; gap: 4px; padding: 8px 12px 0; background: var(--surface); border-bottom: 1px solid var(--line); overflow-x: auto; }
.ltabs button { border: 0; background: none; padding: 10px 14px 12px; font-weight: 700; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; }
.ltabs button[aria-current="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.ltabs .count { background: var(--bad); color: #fff; border-radius: 999px; padding: 0 7px; font-size: 13px; margin-left: 6px; }
.need { display: grid; grid-template-columns: 10px 1fr auto; gap: 12px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px 12px 0; overflow: hidden; }
.need .stripe { align-self: stretch; margin: -12px 0; }
.need .stripe.bad { background: var(--bad); }
.need .stripe.warn { background: var(--warn-line); }
.need .stripe.info { background: var(--accent); }
.need b { display: block; }
.need .sub { color: var(--muted); font-size: 14px; }
.need time { color: var(--muted); font-size: 13px; font-family: var(--font-num); font-size: 16px; }
.evgroup { display: flex; flex-direction: column; gap: 6px; }
.evrow { display: grid; grid-template-columns: 46px 1fr auto; gap: 10px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; }

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>

<script>
const { useState, useEffect, useRef } = React;
const html = htm.bind(React.createElement);

/* ======================================================================
   Domain data (from MSF's scoring workbook template and the map's decisions)
   ====================================================================== */
const DAY_CODE = "4821";
const LEAD_CODE = "K7P2QX";
const OWNER_PASSWORD = "msf-owner";

const SECTION_RANGES = {
  "Boy Beavers": [1, 999], "Girl Beavers": [1, 999],
  "Boy Cubs": [1000, 1999], "Girl Cubs": [2000, 2999],
  "Boy Scouts": [3000, 3999], "Girl Scouts": [4000, 4999],
};
const SECTIONS = ["Boy Beavers", "Girl Beavers", "Boy Cubs", "Girl Cubs", "Boy Scouts", "Girl Scouts"];
function sectionOf(n) {
  if (n >= 1 && n <= 999) return "Beavers";
  for (const s of ["Boy Cubs", "Girl Cubs", "Boy Scouts", "Girl Scouts"]) { const [a, b] = SECTION_RANGES[s]; if (n >= a && n <= b) return s; }
  return null;
}
function mkEvents() {
  const ev = []; let i = 1;
  for (const name of ["60m", "60m Hurdles", "200m"]) for (const s of SECTIONS) ev.push({ code: "R" + i++, name, section: s });
  ev.push({ code: "R23", name: "400m", section: "Boy Scouts" }, { code: "R24", name: "400m", section: "Girl Scouts" });
  return ev.map(e => ({ ...e, format: e.name === "60m" ? "heats" : "timed", stage: "open", dq: {}, warnChecked: {}, ties: {}, notes: [], notCounted: {} }));
}

/* clock: the sample day starts at 10:50 and ticks in real seconds */
const T0 = Date.now(); const START = 10 * 3600 + 50 * 60;
function nowSecs() { return START + Math.floor((Date.now() - T0) / 1000); }
function hhmm(s) { const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60; return `${h}:${String(m).padStart(2, "0")}`; }
function hhmmss(s) { return hhmm(s) + ":" + String(s % 60).padStart(2, "0"); }
const at = (h, m) => h * 3600 + m * 60;

/* times are stored in hundredths; null = No finisher */
function digitsToHund(d) { if (!d) return null; const n = d.replace(/^0+/, "") || "0"; const hh = +n.slice(-2); const ss = +(n.slice(-4, -2) || 0); const mm = +(n.slice(0, -4) || 0); return mm * 6000 + ss * 100 + hh; }
function fmtHund(h) { if (h == null) return ""; const mm = Math.floor(h / 6000), ss = Math.floor(h / 100) % 60, hh = h % 100; return mm ? `${mm}:${String(ss).padStart(2, "0")}.${String(hh).padStart(2, "0")}` : `${ss}.${String(hh).padStart(2, "0")}`; }
function fmtDigits(d) { return d ? fmtHund(digitsToHund(d)) : ""; }
function hundToDigits(h) { if (h == null) return ""; const mm = Math.floor(h / 6000), ss = Math.floor(h / 100) % 60, hh = h % 100; return (mm ? String(mm) + String(ss).padStart(2, "0") : String(ss)) + String(hh).padStart(2, "0"); }
const ord = n => n + (["th", "st", "nd", "rd"][(n % 100 > 10 && n % 100 < 14) ? 0 : (n % 10 < 4 ? n % 10 : 0)] || "th");

/* ---------------------------- sample day ---------------------------- */
let RID = 1;
function mkRace(event, kind, n, nums, t, extra = {}) {
  return { id: RID++, event, kind, n, runners: nums.map(x => typeof x === "number" ? { num: x } : x), checkedInAt: t, order: null, unplaced: {}, removed: [], times: null, timesSavedAt: null, orderSavedAt: null, deleted: null, clash: null, outOfOrder: false, ...extra };
}
function seed() {
  RID = 1;
  const events = mkEvents();
  const E = c => events.find(e => e.code === c);
  const races = [];
  // R4 60m Girl Cubs: three heats recorded, two waiting
  races.push(mkRace("R4", "heat", 1, [2011, 2034, 2050, 2078, 2102, 2140], at(10, 12), { order: [2011, 2034, 2050, 2078, 2102, 2140], times: [962, 987, 1005, 1031, 1044, 1090], orderSavedAt: at(10, 14), timesSavedAt: at(10, 16) }));
  races.push(mkRace("R4", "heat", 2, [2003, 2066, { num: 3045, warning: "wrong" }, 2119, 2121, 2155], at(10, 20), { order: [2066, 2003, 2119, 3045, 2155, 2121], times: [935, 958, 1002, 1020, 1077, 1112], orderSavedAt: at(10, 22), timesSavedAt: at(10, 24) }));
  races.push(mkRace("R4", "heat", 3, [2008, 2045, 2093, 2130, { num: 2077, addedAtFinish: true }], at(10, 31), { order: [2045, 2093, 2008, 2130, 2077], times: [944, 987, 1013, 1056, 1140], orderSavedAt: at(10, 33), timesSavedAt: at(10, 35) }));
  races.push(mkRace("R4", "heat", 4, [2015, 2027, 2061, 2088, 2111, 2149], at(10, 42)));
  races.push(mkRace("R4", "heat", 5, [2004, 2039, 2072, 2124], at(10, 47)));
  E("R4").notes.push({ t: at(10, 34), who: "Aisha", text: "disqualified 2140 (Heat 1): Two false starts" });
  E("R4").dq["1:2140"] = "Two false starts";
  // R3 60m Boy Cubs: heats complete, final waiting at the start line
  races.push(mkRace("R3", "heat", 1, [1012, 1023, 1047, 1088, 1101, 1135], at(10, 2), { order: [1023, 1088, 1012, 1135, 1047, 1101], times: [901, 925, 948, 977, 990, 1024], orderSavedAt: at(10, 4), timesSavedAt: at(10, 6) }));
  races.push(mkRace("R3", "heat", 2, [1005, 1031, 1066, 1092, 1110], at(10, 36), { order: [1066, 1005, 1110, 1031, 1092], times: [912, 939, 961, 1003, 1048], orderSavedAt: at(10, 37), timesSavedAt: at(10, 38) }));
  races.push(mkRace("R3", "final", 1, [1023, 1066, 1088, 1005, 1012, 1110], at(10, 39), { atStart: true }));
  E("R3").stage = "heats_complete";
  E("R3").notes.push({ t: at(10, 39), who: "Aisha", text: "marked heats complete; final created with 1023, 1066, 1088, 1005, 1012, 1110" });
  // R16 200m Girl Cubs (timed)
  races.push(mkRace("R16", "race", 1, [2016, 2052, 2083, 2117, 2160, 2171], at(10, 5), { order: [2052, 2016, 2117, 2171, 2083, 2160], times: [3105, 3188, 3240, 3302, 3391, 3477], orderSavedAt: at(10, 8), timesSavedAt: at(10, 10) }));
  races.push(mkRace("R16", "race", 2, [2021, 2048, 2069, 2104, 2133, 2158], at(10, 25), { order: [2048, 2104, 2021, 2158, 2069, 2133], times: [3150, 3201, 3266, 3340, 3412, null], orderSavedAt: at(10, 28), timesSavedAt: at(10, 29) }));
  races.push(mkRace("R16", "race", 3, [2010, 2036, 2097, 2142], at(10, 38), { order: [2097, 2010, 2142, 2036], orderSavedAt: at(10, 41), clash: { part: "Finish order", a: { who: "Yusuf", order: [2097, 2010, 2142, 2036] }, b: { who: "Maryam", order: [2097, 2142, 2010, 2036] } } }));
  // R13 200m Boy Beavers (timed): a time kept out of order, and one waiting for times
  races.push(mkRace("R13", "race", 1, [12, 37, 58, 104, 233], at(10, 15), { order: [37, 104, 12, 233, 58], times: [3410, 3388, 3521, 3650, 3802], outOfOrder: true, orderSavedAt: at(10, 18), timesSavedAt: at(10, 19) }));
  races.push(mkRace("R13", "race", 2, [5, 66, 141, 207, 318, 402], at(10, 44), { order: [141, 5, 402, 66, 318, 207], orderSavedAt: at(10, 46) }));
  return {
    events, races,
    phones: [
      { name: "Aisha", level: "scoring" }, { name: "Ahmed", level: "volunteer" }, { name: "Yusuf", level: "volunteer" },
      { name: "Maryam", level: "lead" }, { name: "Bilal", level: "volunteer" },
    ],
    dayCode: DAY_CODE, leadCode: LEAD_CODE,
  };
}

/* ---------------------------- race helpers ---------------------------- */
const evOf = (st, r) => st.events.find(e => e.code === r.event);
const live = st => st.races.filter(r => !r.deleted);
function raceName(st, r) { const e = evOf(st, r); return `${e.name} ${e.section}`; }
function raceLabel(r) { return r.kind === "final" ? "Final" : r.kind === "heat" ? `Heat ${r.n}` : `Race ${r.n}`; }
function isLocked(st, r) { const e = evOf(st, r); if (e.stage === "complete") return true; if (e.stage === "heats_complete" && r.kind === "heat") return true; return false; }
const nonNull = t => (t || []).filter(x => x != null).length;
const mismatch = r => !!(r.order && r.times && r.order.length !== nonNull(r.times));
function outOfOrder(times) { let last = -1; for (let i = 0; i < times.length; i++) { const t = times[i]; if (t == null) continue; if (t < last) return i; last = t; } return -1; }
function fullyRecorded(r) { if (r.clash) return false; if (r.kind === "final") return !!r.order; return !!(r.order && r.times && !mismatch(r) && !r.outOfOrder); }
function waitReason(r) {
  if (r.clash) return "two versions, lead to check";
  if (!r.order && !r.times) return "checked in";
  if (r.kind !== "final" && r.order && !r.times) return "awaiting times";
  if (!r.order) return "awaiting finish order";
  if (mismatch(r)) return "finishers and times don't agree";
  if (r.outOfOrder) return "times out of order";
  return "";
}
function waitingFor(st, job) {
  const rs = live(st).filter(r => !isLocked(st, r) && r.runners.length && !r.atStart);
  if (job === "finish") return rs.filter(r => !r.order).sort((a, b) => a.checkedInAt - b.checkedInAt);
  if (job === "times") {
    const w = rs.filter(r => r.kind !== "final" && (!r.times || mismatch(r)));
    return w.sort((a, b) => (mismatch(b) - mismatch(a)) || (a.checkedInAt - b.checkedInAt));
  }
  return [];
}
function recentFor(st, job) {
  const key = job === "finish" ? "orderSavedAt" : "timesSavedAt";
  return live(st).filter(r => r[key] && !(job === "times" && mismatch(r))).sort((a, b) => b[key] - a[key]).slice(0, 4);
}
/* wristband checks: the same everywhere a number is typed */
function checkNumber(st, race, n, list) {
  if (list.some(x => x.num === n)) return { refuse: `${n} is already in this race` };
  if (list.length >= 6) return { refuse: "This race already has 6 runners. Put this child in the next race." };
  const e = evOf(st, race);
  const sec = sectionOf(n);
  if (!sec) return { warning: "unknown", msg: `No section uses ${n}` };
  const ok = sec === "Beavers" ? e.section.endsWith("Beavers") : sec === e.section;
  if (!ok) return { warning: "wrong", msg: `${n} is a ${sec} number, not ${e.section}` };
  const other = live(st).find(r => r.event === race.event && r.id !== race.id && r.runners.some(x => x.num === n));
  if (other) return { warning: "ran", msg: `${n} already ran in this event (${raceLabel(other)})` };
  return {};
}
const WARN_TEXT = { unknown: "Unknown number", wrong: "Wrong section", ran: "Already ran" };

/* ---------------------------- ranking ---------------------------- */
function rankEvent(st, code) {
  const e = st.events.find(x => x.code === code);
  const rs = live(st).filter(r => r.event === code);
  const heats = rs.filter(r => r.kind !== "final");
  const final = rs.find(r => r.kind === "final");
  const recorded = heats.filter(fullyRecorded);
  const notRanked = rs.filter(r => !fullyRecorded(r) && !(r.kind === "final" && !r.order));
  const finalPending = final && !final.order ? final : null;
  let entries = [], out = [];
  for (const r of recorded) {
    r.order.forEach((num, i) => {
      const runner = r.runners.find(x => x.num === num) || { num };
      const key = `${r.id}:${num}`;
      const en = { key, num, time: r.times[i], race: r, place: i + 1, warning: runner.warning, warnKey: key, checked: !!e.warnChecked[key], addedAtFinish: runner.addedAtFinish };
      if (e.dq[key]) out.push({ ...en, status: "dq", reason: e.dq[key] });
      else if (e.notCounted[key]) out.push({ ...en, status: "nc" });
      else entries.push(en);
    });
    Object.entries(r.unplaced).forEach(([num, how]) => { if (how === "dnf") out.push({ key: `${r.id}:${num}`, num: +num, time: null, race: r, status: "dnf" }); });
  }
  const hlN = e.format === "heats" ? 8 : 6;
  entries.sort((a, b) => a.time - b.time || a.race.n - b.race.n);
  // ties: equal times from different races, settled order applied
  const groups = {};
  entries.forEach(en => { (groups[en.time] = groups[en.time] || []).push(en); });
  for (const [t, g] of Object.entries(groups)) {
    if (g.length < 2 || new Set(g.map(x => x.race.id)).size < 2) continue;
    const settled = e.ties[t];
    g.forEach(x => { x.tie = settled ? "settled" : "open"; x.tieTime = +t; });
    if (settled && settled.order) g.sort((a, b) => settled.order.indexOf(a.num) - settled.order.indexOf(b.num));
  }
  // rebuild order with settled ties
  const sorted = []; const seen = new Set();
  entries.forEach(en => { if (seen.has(en.time)) return; seen.add(en.time); sorted.push(...groups[en.time]); });
  entries = sorted;
  entries.forEach((en, i) => { en.pos = i + 1; en.highlighted = i < hlN; if (en.tie === "open" && !en.highlighted) en.tie = null; });
  // a tie with any member in the highlighted places is flagged for every member
  const openTieTimes = new Set(entries.filter(x => x.tie === "open" && x.highlighted).map(x => x.time));
  entries.forEach(en => { if (en.tie === "open" && !openTieTimes.has(en.time)) en.tie = null; if (openTieTimes.has(en.time)) en.tie = "open"; });
  // ran twice
  const count = {}; entries.forEach(en => { count[en.num] = (count[en.num] || 0) + 1; });
  entries.forEach(en => { if (count[en.num] > 1) en.ranTwice = true; });
  // final
  let finalRows = null;
  if (final && final.order) finalRows = final.order.map((num, i) => { const key = `${final.id}:${num}`; return { key, num, pos: i + 1, race: final, status: e.dq[key] ? "dq" : null, reason: e.dq[key] }; });
  return { e, entries, out, notRanked, hlN, final, finalPending, finalRows, heats, openTies: [...openTieTimes] };
}
function needsYou(st) {
  const items = [];
  for (const r of live(st)) {
    const nm = `${raceName(st, r)} (${r.event}) · ${raceLabel(r)}`;
    if (r.clash) items.push({ kind: "bad", title: `Two versions of the ${r.clash.part.toLowerCase()}`, sub: nm, t: r.orderSavedAt || r.checkedInAt, race: r.id, event: r.event });
    if (r.outOfOrder) items.push({ kind: "bad", title: "Times out of order - check the recording", sub: nm, t: r.timesSavedAt, race: r.id, event: r.event });
    if (mismatch(r)) items.push({ kind: "bad", title: `Finish order has ${r.order.length} finishers, times have ${nonNull(r.times)}`, sub: nm, t: r.timesSavedAt, race: r.id, event: r.event });
    r.runners.forEach(x => {
      const e = evOf(st, r); const key = `${r.id}:${x.num}`;
      if (x.warning && !e.warnChecked[key] && !e.dq[key]) items.push({ kind: "warn", title: `${x.num}: ${WARN_TEXT[x.warning]}`, sub: nm, t: r.checkedInAt, race: r.id, event: r.event });
      if (x.addedAtFinish && !x.seen) items.push({ kind: "info", title: `${x.num} added at the finish`, sub: nm, t: r.orderSavedAt || r.checkedInAt, race: r.id, event: r.event, seenKey: [r.id, x.num] });
    });
  }
  for (const e of st.events) {
    const rk = rankEvent(st, e.code);
    rk.openTies.forEach(t => {
      const who = rk.entries.filter(x => x.time === t).map(x => x.num).join(" and ");
      items.push({ kind: "bad", title: `Tie in the highlighted places: ${who} (${fmtHund(t)})`, sub: `${e.name} ${e.section} (${e.code})`, t: nowSecs() - 300, event: e.code });
    });
    if (rk.entries.some(x => x.ranTwice && x.highlighted)) items.push({ kind: "bad", title: "A runner ran twice", sub: `${e.name} ${e.section} (${e.code})`, t: nowSecs() - 200, event: e.code });
  }
  return items.sort((a, b) => b.t - a.t);
}
function eventStatus(st, e) {
  const rs = live(st).filter(r => r.event === e.code);
  if (e.stage === "complete") return { text: "Complete", tone: "ok" };
  if (e.stage === "heats_complete") return { text: "Heats complete - final to run", tone: "info" };
  if (!rs.length) return { text: "Not started", tone: "grey" };
  return { text: `In progress - provisional (${rs.length} race${rs.length > 1 ? "s" : ""})`, tone: "warn" };
}

/* ======================================================================
   Shared pieces
   ====================================================================== */
function Keypad({ onDigit, onBack, extra, go, goLabel = "Add", goDisabled }) {
  const keys = ["1", "2", "3", "4", "5", "6", "7", "8", "9"];
  return html`<div className="keypad">
    ${keys.map(k => html`<button key=${k} onClick=${() => onDigit(k)}>${k}</button>`)}
    ${extra || html`<button className="fn" onClick=${onBack} aria-label="Delete">⌫</button>`}
    <button onClick=${() => onDigit("0")}>0</button>
    ${go ? html`<button className="fn go" disabled=${goDisabled} onClick=${go}>${goLabel}</button>` : html`<button className="fn" onClick=${onBack} aria-label="Delete">⌫</button>`}
  </div>`;
}
function Sheet({ children, onClose }) {
  return html`<div className="sheet-bg" onClick=${e => { if (e.target === e.currentTarget && onClose) onClose(); }}><div className="sheet" role="dialog">${children}</div></div>`;
}
function RaceHead({ st, r, extra }) {
  const locked = isLocked(st, r);
  const n = r.runners.length;
  return html`<div className=${"racehead" + (locked ? " locked" : "")}>
    <div className="ev">${raceName(st, r)} <span className="code">(${r.event})</span></div>
    <div className="ev" style=${{ fontSize: 22 }}>${raceLabel(r)}</div>
    <div className="meta">${n} runner${n === 1 ? "" : "s"} · checked in <span className="num" style=${{ fontSize: 18 }}>${hhmm(r.checkedInAt)}</span>${extra ? " · " + extra : ""}</div>
  </div>`;
}
function Locked() { return html`<div className="lock"><span aria-hidden="true">🔒</span> Stage complete - ask a lead</div>`; }
function Updated({ onRefresh }) {
  return html`<div className="updated"><span>Updated at <span className="num" style=${{ fontSize: 14 }}>${hhmmss(nowSecs())}</span></span><button onClick=${onRefresh}>Refresh</button></div>`;
}
function WarnSheet({ w, onFix, onKeep }) {
  return html`<${Sheet}>
    <div className="display warn">${w.num}</div>
    <h3>${w.msg}</h3>
    <p>Check the wristband. If the number is right, keep it and the child can run. A lead checks it later.</p>
    <div className="row"><button className="btn block" onClick=${onFix}>Fix number</button><button className="btn warn block" onClick=${onKeep}>Keep</button></div>
  <//>`;
}
function RaceLists({ st, job, current, onPick }) {
  const waiting = waitingFor(st, job).filter(r => !current || r.id !== current.id);
  const recent = recentFor(st, job).filter(r => !current || r.id !== current.id);
  const item = (r, sub) => html`<button key=${r.id} className="listbtn" onClick=${() => onPick(r.id)}>
    <span><b>${raceName(st, r)} (${r.event}) · ${raceLabel(r)}</b><br/><span className="sub">${sub}</span></span><span className="chev">›</span></button>`;
  return html`<div className="list">
    ${waiting.length ? html`<div className="label">Also waiting</div>` : null}
    ${waiting.map(r => item(r, `${r.runners.length} runners · checked in ${hhmm(r.checkedInAt)}${mismatch(r) ? " · counts don't agree" : ""}`))}
    ${recent.length ? html`<div className="label" style=${{ marginTop: 6 }}>Recent races</div>` : null}
    ${recent.map(r => item(r, isLocked(st, r) ? "Stage complete - ask a lead" : `Saved at ${hhmm(job === "finish" ? r.orderSavedAt : r.timesSavedAt)} · tap to correct`))}
  </div>`;
}
/* save with a short "Saving" beat, like a real server round-trip */
function useSaver(toast) {
  return (fn, msg = "Saved") => { toast("Saving…"); setTimeout(() => { fn(); toast(msg); }, 450); };
}

/* ---------- finish order logic shared by the three variants ---------- */
function useFinishOrder(r) {
  const [placed, setPlaced] = useState(r ? (r.order || []) : []);
  const [extra, setExtra] = useState([]); // runners added at the finish in this session
  useEffect(() => { setPlaced(r ? (r.order || []) : []); setExtra([]); }, [r && r.id]);
  const all = r ? [...r.runners.map(x => x.num), ...extra.map(x => x.num)] : [];
  const unplaced = all.filter(n => !placed.includes(n));
  const tap = n => setPlaced(p => p.includes(n) ? p.filter(x => x !== n) : [...p, n]);
  const move = (i, d) => setPlaced(p => { const a = [...p]; const j = i + d; if (j < 0 || j >= a.length) return a; [a[i], a[j]] = [a[j], a[i]]; return a; });
  return { placed, setPlaced, unplaced, tap, move, all, extra, setExtra };
}
function saveFinish(st, r, fo, how) {
  const race = st.races.find(x => x.id === r.id);
  fo.extra.forEach(x => race.runners.push({ ...x, addedAtFinish: true }));
  race.order = [...fo.placed];
  race.unplaced = {};
  for (const n of fo.unplaced) {
    if (how[n] === "didnt") { race.runners = race.runners.filter(x => x.num !== n); race.removed.push(n); }
    else race.unplaced[n] = "dnf";
  }
  race.orderSavedAt = nowSecs();
  race.clash = null;
}
function AddRunnerSheet({ st, r, list, onAdd, onClose }) {
  const [d, setD] = useState("");
  const [w, setW] = useState(null);
  const [refuse, setRefuse] = useState("");
  const add = () => {
    const n = +d; if (!n) return;
    const c = checkNumber(st, r, n, list);
    if (c.refuse) { setRefuse(c.refuse); return; }
    if (c.warning) { setW({ num: n, ...c }); return; }
    onAdd({ num: n });
  };
  if (w) return html`<${WarnSheet} w=${w} onFix=${() => { setW(null); setD(""); }} onKeep=${() => onAdd({ num: w.num, warning: w.warning })} />`;
  return html`<${Sheet} onClose=${onClose}>
    <h3>Runner not on the list</h3>
    <p>Type the wristband number. The zone lead is told.</p>
    <div className=${"display" + (d ? "" : " empty")}>${d || "Wristband number"}</div>
    ${refuse ? html`<div className="alert bad">${refuse}</div>` : null}
    <${Keypad} onDigit=${k => { setRefuse(""); setD(x => (x + k).slice(0, 4)); }} onBack=${() => setD(x => x.slice(0, -1))} go=${add} goDisabled=${!d} />
    <button className="btn block" onClick=${onClose}>Cancel</button>
  <//>`;
}
function UnplacedSheet({ unplaced, onDone, onClose }) {
  const [how, setHow] = useState({});
  const done = unplaced.every(n => how[n]);
  return html`<${Sheet} onClose=${onClose}>
    <h3>${unplaced.length === 1 ? "1 runner has" : unplaced.length + " runners have"} no place</h3>
    <p>For each one, what happened?</p>
    ${unplaced.map(n => html`<div key=${n} className="card" style=${{ display: "flex", flexDirection: "column", gap: 8 }}>
      <div className="num" style=${{ fontSize: 32, fontWeight: 700 }}>${n}</div>
      <div className="segs">
        <button aria-pressed=${how[n] === "dnf"} onClick=${() => setHow(h => ({ ...h, [n]: "dnf" }))}>Did not finish<br/><small style=${{ fontWeight: 400, color: "var(--muted)" }}>Started, didn't cross the line</small></button>
        <button aria-pressed=${how[n] === "didnt"} onClick=${() => setHow(h => ({ ...h, [n]: "didnt" }))}>Didn't run<br/><small style=${{ fontWeight: 400, color: "var(--muted)" }}>Taken off this race, can run later</small></button>
      </div></div>`)}
    <button className="btn primary block" disabled=${!done} onClick=${() => onDone(how)}>Save finish order</button>
    <button className="btn block" onClick=${onClose}>Back</button>
  <//>`;
}

/* ---------- times logic shared by the three variants ---------- */
function initTimes(r) {
  const n = r.runners.length;
  const boxes = Array.from({ length: n }, (_, i) => r.times && i < r.times.length ? (r.times[i] == null ? { nf: true, d: "" } : { d: hundToDigits(r.times[i]) }) : { d: "" });
  if (!r.times && r.order) for (let i = r.order.length; i < n; i++) boxes[i] = { nf: true, d: "", pre: true };
  return boxes;
}
function useTimes(r) {
  const [boxes, setBoxes] = useState(r ? initTimes(r) : []);
  const [kept, setKept] = useState(r && r.outOfOrder ? true : false);
  useEffect(() => { if (r) { setBoxes(initTimes(r)); setKept(!!r.outOfOrder); } }, [r && r.id]);
  const vals = boxes.map(b => b.nf ? null : digitsToHund(b.d));
  const ooo = outOfOrder(vals);
  const setDigits = (i, d) => setBoxes(bs => bs.map((b, j) => j === i ? { d: d.replace(/\D/g, "").slice(0, 6) } : b));
  const markNF = () => setBoxes(bs => { const a = [...bs]; for (let i = a.length - 1; i >= 0; i--) if (!a[i].nf) { a[i] = { nf: true, d: "" }; break; } return a; });
  const unmarkNF = () => setBoxes(bs => { const a = [...bs]; for (let i = 0; i < a.length; i++) if (a[i].nf) { a[i] = { d: "" }; break; } return a; });
  const filled = boxes.every(b => b.nf || b.d);
  const finishers = boxes.filter(b => !b.nf).length;
  return { boxes, setBoxes, vals, ooo, setDigits, markNF, unmarkNF, filled, finishers, kept, setKept };
}
function saveTimes(st, r, tm) {
  const race = st.races.find(x => x.id === r.id);
  race.times = tm.vals;
  race.outOfOrder = tm.ooo >= 0;
  race.timesSavedAt = nowSecs();
}
function OooWarn({ tm, i }) {
  return html`<div className="alert warn" style=${{ display: "flex", flexDirection: "column", gap: 8 }}>
    <span>${ord(i + 1)} (${fmtHund(tm.vals[i])}) is faster than ${ord(i)}. Check the timer.</span>
    <div className="row"><button className="btn block" onClick=${() => tm.setDigits(i, "")}>Fix time</button><button className="btn warn block" onClick=${() => tm.setKept(true)}>Keep</button></div>
  </div>`;
}
function MismatchNote({ st, r, tm }) {
  if (!r.order) return null;
  if (tm.finishers === r.order.length) return null;
  return html`<div className="alert bad">Finish order has ${r.order.length} finishers, times have ${tm.finishers} - check the recording</div>`;
}

/* ---------- start line logic shared by the three variants ---------- */
function useStartLine(st, r) {
  const [list, setList] = useState(r ? r.runners.map(x => ({ ...x })) : []);
  const [d, setD] = useState("");
  const [w, setW] = useState(null);
  const [refuse, setRefuse] = useState("");
  useEffect(() => { setList(r ? r.runners.map(x => ({ ...x })) : []); setD(""); setW(null); setRefuse(""); }, [r && r.id]);
  const add = (digits) => {
    const n = +(digits ?? d); if (!n || !r) return;
    const c = checkNumber(st, r, n, list);
    if (c.refuse) { setRefuse(c.refuse); return; }
    if (c.warning) { setW({ num: n, ...c }); return; }
    setList(l => [...l, { num: n }]); setD(""); setRefuse("");
  };
  const keep = () => { setList(l => [...l, { num: w.num, warning: w.warning }]); setW(null); setD(""); };
  const fix = () => { setW(null); };
  const remove = n => setList(l => l.filter(x => x.num !== n));
  const toggleAbsent = n => setList(l => l.map(x => x.num === n ? { ...x, absent: !x.absent } : x));
  return { list, d, setD, add, w, keep, fix, refuse, setRefuse, remove, toggleAbsent };
}
function saveRunners(st, r, sl) {
  const race = st.races.find(x => x.id === r.id);
  race.runners = sl.list.filter(x => !x.absent).map(x => ({ num: x.num, warning: x.warning }));
  race.absent = sl.list.filter(x => x.absent).map(x => x.num);
  race.atStart = false;
}
function newRace(st, code) {
  const e = st.events.find(x => x.code === code);
  const n = st.races.filter(r => r.event === code && r.kind !== "final").length + 1;
  const r = mkRace(code, e.format === "heats" ? "heat" : "race", n, [], nowSecs(), { atStart: true });
  st.races.push(r);
  return r.id;
}
function canEditRunners(r) { return !r.order; }
function DeleteSheet({ onPerm, onSoft, onClose }) {
  return html`<${Sheet} onClose=${onClose}>
    <h3>Delete this race?</h3>
    <p>Move it to Deleted races if a lead might want it back. Delete permanently if it was made by mistake.</p>
    <button className="btn block" onClick=${onSoft}>Move to Deleted races</button>
    <button className="btn danger block" onClick=${onPerm}>Delete permanently</button>
    <button className="btn block" onClick=${onClose}>Cancel</button>
  <//>`;
}
function startLineRaces(st) {
  // still being checked in first, then races checked in whose runners can change until the finish order is saved
  return live(st).filter(r => !isLocked(st, r) && !r.order).sort((a, b) => (!!b.atStart - !!a.atStart) || (a.checkedInAt - b.checkedInAt));
}
function eventsByName(st) {
  const g = []; st.events.forEach(e => { let x = g.find(y => y.name === e.name); if (!x) g.push(x = { name: e.name, evs: [] }); x.evs.push(e); }); return g;
}

function A_Start(p) {
  const { st, nav, go, mutate, save, toast } = p;
  const r = nav.race ? st.races.find(x => x.id === nav.race) : null;
  const sl = useStartLine(st, r);
  const [del, setDel] = useState(false);
  if (!r) {
    const at = startLineRaces(st);
    return html`<div className="scroll">
      ${[["Being checked in", at.filter(x => x.atStart)], ["Checked in · runners can still change", at.filter(x => !x.atStart)]].map(([lbl, xs]) => xs.length ? html`<div key=${lbl} className="list"><div className="label">${lbl}</div>
        ${xs.map(x => html`<button key=${x.id} className="listbtn" onClick=${() => go({ race: x.id })}><span><b>${raceName(st, x)} (${x.event}) · ${raceLabel(x)}</b><br/><span className="sub">${x.kind === "final" && x.atStart ? "Pre-filled · mark anyone absent" : x.runners.length + " checked in · " + hhmm(x.checkedInAt)}</span></span><span className="chev">›</span></button>`)}</div>` : null)}
      <div className="label" style=${{ marginTop: 6 }}>Start a new race</div>
      ${eventsByName(st).map(g => html`<div key=${g.name} className="list">
        <div style=${{ fontWeight: 700 }}>${g.name}</div>
        ${g.evs.filter(e => e.stage === "open").map(e => html`<button key=${e.code} className="listbtn" onClick=${() => { let id; mutate(s => { id = newRace(s, e.code); }); setTimeout(() => go({ race: id }), 0); }}><span>${e.section} <span className="sub">(${e.code})</span></span><span className="chev">+</span></button>`)}
      </div>`)}
    </div>`;
  }
  const isFinal = r.kind === "final";
  if (isLocked(st, r)) return html`<div className="scroll"><${RaceHead} st=${st} r=${r} /><${Locked} /></div>`;
  return html`<div className="scr"><div className="scroll">
    <${RaceHead} st=${st} r=${{ ...r, runners: sl.list.filter(x => !x.absent) }} />
    ${isFinal ? html`<div className="alert ok">Final pre-filled with the 6 qualifiers. Tap anyone who isn't here.</div>` : html`
      <div className="slots">${[0, 1, 2, 3, 4, 5].map(i => html`<div key=${i} className=${"slot" + (i < sl.list.length ? " on" : "")}></div>`)}</div>
      <form className="row" onSubmit=${e => { e.preventDefault(); sl.add(); }}>
        <input id="a-wrist" className="tinput num" style=${{ height: 58, fontSize: 30, flex: 1 }} inputMode="numeric" pattern="[0-9]*" placeholder="Wristband number" value=${sl.d} onChange=${e => { sl.setRefuse(""); sl.setD(e.target.value.replace(/\D/g, "").slice(0, 4)); }} disabled=${sl.list.length >= 6} />
        <button className="btn primary" type="submit" disabled=${!sl.d}>Add</button>
      </form>
      ${sl.refuse ? html`<div className="alert bad">${sl.refuse}</div>` : null}
      ${sl.list.length >= 6 ? html`<div className="alert ok">6 runners: this race is full.</div>` : null}`}
    <div className="chips">${sl.list.map(x => html`<span key=${x.num} className=${"chip" + (x.warning ? " warn" : "") + (x.absent ? " absent" : "")}>
      <span className="n">${x.num}</span>${x.warning ? html`<span className="pill warn">${WARN_TEXT[x.warning]}</span>` : null}
      ${isFinal ? html`<button aria-label="Mark absent" onClick=${() => sl.toggleAbsent(x.num)}>${x.absent ? "↺" : "✕"}</button>` : html`<button aria-label=${"Remove " + x.num} onClick=${() => sl.remove(x.num)}>✕</button>`}</span>`)}</div>
    <button className="btn primary block" disabled=${!sl.list.length} onClick=${() => save(() => mutate(s => saveRunners(s, r, sl)), "Saved - race is ready at the finish")}>Save runners</button>
    ${!isFinal ? html`<button className="btn block" onClick=${() => setDel(true)}>Delete race</button>` : null}
    <p className="who">Runners can be changed until the finish order is saved.</p>
  </div>
  ${sl.w ? html`<${WarnSheet} w=${sl.w} onFix=${sl.fix} onKeep=${sl.keep} />` : null}
  ${del ? html`<${DeleteSheet} onClose=${() => setDel(false)} onSoft=${() => { mutate(s => { s.races.find(x => x.id === r.id).deleted = "soft"; }); go({ race: null }); toast("Moved to Deleted races"); }} onPerm=${() => { mutate(s => { s.races = s.races.filter(x => x.id !== r.id); }); go({ race: null }); toast("Race deleted"); }} />` : null}
  </div>`;
}
function A_Finish(p) {
  const { st, nav, go, mutate, save, refresh } = p;
  const w = waitingFor(st, "finish");
  const r = nav.race ? st.races.find(x => x.id === nav.race) : w[0];
  const fo = useFinishOrder(r);
  const [sheet, setSheet] = useState(null);
  if (!r) return html`<div className="scroll"><div className="alert ok">No races waiting for a finish order.</div><${RaceLists} st=${st} job="finish" onPick=${id => go({ race: id })} /></div>`;
  const locked = isLocked(st, r);
  const doSave = how => { setSheet(null); save(() => { mutate(s => saveFinish(s, r, fo, how)); go({ race: null }); }, "Saved finish order"); };
  return html`<div className="scr"><div className="scroll">
    <${Updated} onRefresh=${refresh} />
    <${RaceHead} st=${st} r=${r} />
    ${locked ? html`<${Locked} />` : html`
    <div className="label">Finishing order</div>
    <div className="placed">
      ${fo.placed.map((n, i) => html`<div key=${n} className="prow"><span className="pl">${ord(i + 1)}</span><span className="n">${n}</span>
        <button className="ic" aria-label="Move up" onClick=${() => fo.move(i, -1)} disabled=${i === 0}>▲</button>
        <button className="ic" aria-label="Move down" onClick=${() => fo.move(i, 1)} disabled=${i === fo.placed.length - 1}>▼</button>
        <button className="ic" aria-label=${"Take out " + n} onClick=${() => fo.tap(n)}>✕</button></div>`)}
      ${fo.unplaced.length ? html`<div className="prow empty"><span className="pl">${ord(fo.placed.length + 1)}</span><span className="n">Tap who came ${ord(fo.placed.length + 1)}</span></div>` : null}
    </div>
    ${fo.unplaced.length ? html`<div className="numgrid">${fo.unplaced.map(n => html`<button key=${n} className="bignum" onClick=${() => fo.tap(n)}>${n}</button>`)}</div>` : null}
    <button className="btn ghost block" onClick=${() => setSheet("add")}>+ Runner not on the list</button>
    <button className="btn primary block" disabled=${!fo.placed.length && !fo.unplaced.length} onClick=${() => fo.unplaced.length ? setSheet("unplaced") : doSave({})}>Save</button>`}
    <${RaceLists} st=${st} job="finish" current=${r} onPick=${id => go({ race: id })} />
  </div>
  ${sheet === "add" ? html`<${AddRunnerSheet} st=${st} r=${r} list=${fo.all.map(n => ({ num: n }))} onClose=${() => setSheet(null)} onAdd=${x => { fo.setExtra(e => [...e, x]); setSheet(null); }} />` : null}
  ${sheet === "unplaced" ? html`<${UnplacedSheet} unplaced=${fo.unplaced} onClose=${() => setSheet(null)} onDone=${doSave} />` : null}
  </div>`;
}
function A_Times(p) {
  const { st, nav, go, mutate, save, refresh } = p;
  const w = waitingFor(st, "times");
  const r = nav.race ? st.races.find(x => x.id === nav.race) : w[0];
  const tm = useTimes(r);
  if (!r) return html`<div className="scroll"><div className="alert ok">No races waiting for times.</div><${RaceLists} st=${st} job="times" onPick=${id => go({ race: id })} /></div>`;
  const locked = isLocked(st, r);
  const firstNF = tm.boxes.findIndex(b => b.nf);
  return html`<div className="scr"><div className="scroll">
    <${Updated} onRefresh=${refresh} />
    ${mismatch(r) && !nav.race ? html`<div className="alert bad">Finish order has ${r.order.length} finishers, times have ${nonNull(r.times)} - check the recording</div>` : null}
    <${RaceHead} st=${st} r=${r} />
    ${locked ? html`<${Locked} />` : html`
    <div className="label">Times by place · one box per runner checked in</div>
    <div className="tlist">
      ${tm.boxes.map((b, i) => b.nf ? html`<div key=${i} className="trow nf"><span className="pl">${ord(i + 1)}</span><span className="nfl">No finisher</span>
          ${i === firstNF ? html`<button className="btn" style=${{ minHeight: 40, fontSize: 14 }} onClick=${tm.unmarkNF}>Undo</button>` : html`<span></span>`}</div>`
        : html`<div key=${i} className=${"trow" + (tm.ooo === i && !tm.kept ? " warn" : "")}>
          <span className="pl">${ord(i + 1)}</span>
          <input id=${"a-time-" + i} inputMode="numeric" pattern="[0-9]*" placeholder="e.g. 1234 → 12.34" value=${b.d} onChange=${e => { tm.setKept(false); tm.setDigits(i, e.target.value); }} aria-label=${ord(i + 1) + " place time"} />
          <span className="fmt">${fmtDigits(b.d)}</span></div>`)}
    </div>
    ${tm.ooo >= 0 && !tm.kept ? html`<${OooWarn} tm=${tm} i=${tm.ooo} />` : null}
    <button className="btn block" onClick=${tm.markNF} disabled=${tm.boxes.every(b => b.nf)}>No finisher (bottom place)</button>
    <${MismatchNote} st=${st} r=${r} tm=${tm} />
    <button className="btn primary block" disabled=${!tm.filled || (tm.ooo >= 0 && !tm.kept)} onClick=${() => save(() => { mutate(s => saveTimes(s, r, tm)); go({ race: null }); }, "Saved times")}>Save times</button>`}
    <${RaceLists} st=${st} job="times" current=${r} onPick=${id => go({ race: id })} />
  </div></div>`;
}

/* ======================================================================
